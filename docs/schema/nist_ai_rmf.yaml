classes:
  NistAiRmfFamily:
    name: NistAiRmfFamily
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/NistAiRmfFamily
    description: The two publications held in one document, each as its own schema
      renders it.
    comments:
    - Each publication's root stays a root, so a file that holds one publication alone
      validates against AiRmfFramework or GaiProfile. The JSON Schema's top level
      is this class, and it refuses a document that holds neither.
    from_schema: https://w3id.org/lmodel/nist-ai-rmf
    slots:
    - nistAiRmfFamily__nist_ai_rmf_framework
    - nistAiRmfFamily__nist_ai_rmf_generative_ai_profile
    attributes:
      nist_ai_rmf_framework:
        name: nist_ai_rmf_framework
        description: The AI RMF, as lmodel/nist-ai-100-1 renders it.
        see_also:
        - https://doi.org/10.6028/NIST.AI.100-1
        range: AiRmfFramework
        inlined: true
      nist_ai_rmf_generative_ai_profile:
        name: nist_ai_rmf_generative_ai_profile
        description: The Generative AI Profile, as lmodel/nist-ai-600-1 renders it.
        see_also:
        - https://doi.org/10.6028/NIST.AI.600-1
        range: GaiProfile
        inlined: true
    class_uri: nist_ai_rmf:NistAiRmfFamily
    tree_root: true
    any_of:
    - slot_conditions:
        nist_ai_rmf_framework:
          name: nist_ai_rmf_framework
          required: true
    - slot_conditions:
        nist_ai_rmf_generative_ai_profile:
          name: nist_ai_rmf_generative_ai_profile
          required: true
  AiRmfFramework:
    name: AiRmfFramework
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfFramework
    description: One edition of the AI RMF as a whole, with the Core and the lists
      the publication gives.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1
    exact_mappings:
    - nist_ai_100_1:Framework
    broad_mappings:
    - oscal:Catalog
    slots:
    - aiRmfFramework__ai_rmf_version
    - aiRmfFramework__ai_rmf_functions
    - aiRmfFramework__ai_rmf_characteristics
    - aiRmfFramework__ai_rmf_dimensions
    - aiRmfFramework__ai_rmf_lifecycle_stages
    - aiRmfFramework__ai_rmf_actor_task_list
    - aiRmfFramework__ai_rmf_management_challenges
    - aiRmfFramework__ai_rmf_specific_risks
    - aiRmfFramework__ai_rmf_human_ai_issues
    - aiRmfFramework__ai_rmf_attributes
    attributes:
      ai_rmf_version:
        name: ai_rmf_version
        description: The edition in NIST's two-number form, such as 1.0.
        required: true
        pattern: ^[0-9]+\.[0-9]+$
      ai_rmf_functions:
        name: ai_rmf_functions
        description: The four functions, in the publication's order.
        range: AiRmfFunction
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      ai_rmf_characteristics:
        name: ai_rmf_characteristics
        description: The trustworthiness characteristics of section 3.
        range: AiRmfTrustworthinessCharacteristic
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_dimensions:
        name: ai_rmf_dimensions
        description: The key dimensions of Figure 2.
        range: AiRmfDimension
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_lifecycle_stages:
        name: ai_rmf_lifecycle_stages
        description: The lifecycle stages of Figure 3.
        range: AiRmfLifecycleStage
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_actor_task_list:
        name: ai_rmf_actor_task_list
        description: The AI actor tasks and additional AI actors of Appendix A.
        range: AiRmfActorTask
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_management_challenges:
        name: ai_rmf_management_challenges
        description: The challenges for AI risk management of section 1.2.
        range: AiRmfManagementChallenge
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_specific_risks:
        name: ai_rmf_specific_risks
        description: The AI-specific risks of Appendix B.
        range: AiRmfSpecificRisk
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_human_ai_issues:
        name: ai_rmf_human_ai_issues
        description: The human-AI interaction issues of Appendix C.
        range: AiRmfHumanAiIssue
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_attributes:
        name: ai_rmf_attributes
        description: The attributes of the AI RMF in Appendix D.
        range: AiRmfAttribute
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_ai_100_1:Framework
    tree_root: true
  GaiProfile:
    name: GaiProfile
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiProfile
    description: The Generative AI Profile as a whole, a cross-sectoral profile of
      the AI RMF and a companion resource to it.
    comments:
    - It holds actions for only some subcategories, and the publication says more
      may be added later.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1
    exact_mappings:
    - nist_ai_600_1:Profile
    is_a: AiRmfProfile
    slots:
    - ai_rmf_id
    - title
    - description
    - aiRmfProfile__ai_rmf_profile_kinds
    - aiRmfProfile__ai_rmf_profile_setting
    - aiRmfProfile__ai_rmf_profile_subcategories
    - gaiProfile__gai_risks
    - gaiProfile__gai_subcategories
    - gaiProfile__gai_primary_considerations
    attributes:
      gai_risks:
        name: gai_risks
        description: The 12 risks of section 2.
        range: GaiRisk
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      gai_subcategories:
        name: gai_subcategories
        description: The tables of section 3, in the publication's order.
        range: GaiSubcategory
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      gai_primary_considerations:
        name: gai_primary_considerations
        description: The four primary considerations of Appendix A.
        range: GaiPrimaryConsideration
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_ai_600_1:Profile
    tree_root: true
  AiRmfRecord:
    name: AiRmfRecord
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfRecord
    description: The base of the classes that record an adopter's own facts, such
      as one of its AI systems or risks, as distinct from what the publication itself
      lists.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    exact_mappings:
    - nist_ai_100_1:Record
    abstract: true
    slots:
    - ai_rmf_id
    - title
    - description
    class_uri: nist_ai_100_1:Record
  AiRmfTrustworthinessCharacteristic:
    name: AiRmfTrustworthinessCharacteristic
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfTrustworthinessCharacteristic
    description: A characteristic of trustworthy AI systems, each with a subsection
      of section 3.
    comments:
    - Addressing the characteristics one by one does not make a system trustworthy,
      since they trade off against each other.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:TrustworthinessCharacteristic
    slots:
    - description
    - aiRmfTrustworthinessCharacteristic__ai_rmf_characteristic_name
    - aiRmfTrustworthinessCharacteristic__ai_rmf_characteristic_section
    - aiRmfTrustworthinessCharacteristic__ai_rmf_characteristic_is_base
    - aiRmfTrustworthinessCharacteristic__ai_rmf_characteristic_relates_to_all
    attributes:
      ai_rmf_characteristic_name:
        name: ai_rmf_characteristic_name
        description: Which characteristic this is.
        range: AiRmfCharacteristicName
        required: true
      ai_rmf_characteristic_section:
        name: ai_rmf_characteristic_section
        description: The subsection of the publication that describes it, such as
          3.1.
        required: true
        pattern: ^3\.[1-7]$
      ai_rmf_characteristic_is_base:
        name: ai_rmf_characteristic_is_base
        description: Whether Figure 4 shows it as the necessary condition under the
          others.
        range: boolean
      ai_rmf_characteristic_relates_to_all:
        name: ai_rmf_characteristic_relates_to_all
        description: Whether Figure 4 shows it relating to all the others.
        range: boolean
    class_uri: nist_ai_100_1:TrustworthinessCharacteristic
  AiRmfDimension:
    name: AiRmfDimension
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfDimension
    description: One of the five key socio-technical dimensions of an AI system in
      Figure 2.
