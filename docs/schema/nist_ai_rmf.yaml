    description: One of the challenges of measuring AI risk in section 1.2.1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:MeasurementChallenge
    slots:
    - description
