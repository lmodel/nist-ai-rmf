    is_a: AiRmfRecord
    slots:
    - ai_rmf_id
    - title
    - description
    - aiRmfActor__ai_rmf_actor_tasks
    - aiRmfActor__ai_rmf_actor_audience
    - aiRmfActor__ai_rmf_actor_lifecycle_stages
    attributes:
      ai_rmf_actor_tasks:
        name: ai_rmf_actor_tasks
        description: The tasks the actor carries out, or the additional AI actor it
          is.
        range: AiRmfActorTaskName
        multivalued: true
      ai_rmf_actor_audience:
        name: ai_rmf_actor_audience
        description: The AI RMF audience the actor belongs to.
        range: AiRmfAudience
      ai_rmf_actor_lifecycle_stages:
        name: ai_rmf_actor_lifecycle_stages
        description: The lifecycle stages the actor works in.
        range: AiRmfLifecycleStageName
        multivalued: true
    class_uri: nist_ai_100_1:AiActor
  AiRmfRisk:
    name: AiRmfRisk
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfRisk
    description: How likely an event is, combined with how severe its consequences
      are.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:Risk
    related_mappings:
    - iso27001:IsmsRisk
    is_a: AiRmfRecord
    slots:
    - ai_rmf_id
    - title
    - description
    - ai_rmf_likelihood
    - ai_rmf_magnitude
    - aiRmfRisk__ai_rmf_risk_system
    - aiRmfRisk__ai_rmf_risk_impacts
    - aiRmfRisk__ai_rmf_risk_characteristics
    - aiRmfRisk__ai_rmf_risk_lifecycle_stages
    - aiRmfRisk__ai_rmf_risk_responses
    - aiRmfRisk__ai_rmf_risk_priority
    - aiRmfRisk__ai_rmf_risk_tolerance
    attributes:
      ai_rmf_risk_system:
        name: ai_rmf_risk_system
        description: The AI system the risk concerns.
        range: AiRmfSystem
      ai_rmf_risk_impacts:
        name: ai_rmf_risk_impacts
        description: The impacts that contribute to the risk.
        range: AiRmfImpact
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_risk_characteristics:
        name: ai_rmf_risk_characteristics
        description: The trustworthiness characteristics the risk bears on.
        range: AiRmfCharacteristicName
        multivalued: true
      ai_rmf_risk_lifecycle_stages:
        name: ai_rmf_risk_lifecycle_stages
        description: The lifecycle stages where the risk is measured or arises.
        range: AiRmfLifecycleStageName
        multivalued: true
      ai_rmf_risk_responses:
        name: ai_rmf_risk_responses
        description: The responses chosen for the risk.
        range: AiRmfRiskResponse
        multivalued: true
      ai_rmf_risk_priority:
        name: ai_rmf_risk_priority
        description: The priority the adopter gives the risk's treatment, on whatever
          scale it uses, as MANAGE 1.2 asks.
        comments:
        - MANAGE 1.3 speaks of risks deemed high priority and the publication sets
          no scale, so this is text.
      ai_rmf_risk_tolerance:
        name: ai_rmf_risk_tolerance
        description: The risk tolerance the risk is judged against, which GOVERN 1.3
          and MAP 1.5 ask an adopter to document.
        range: AiRmfRiskTolerance
    class_uri: nist_ai_100_1:Risk
  AiRmfResidualRisk:
    name: AiRmfResidualRisk
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfResidualRisk
    description: The risk that remains after risk treatment.
    comments:
    - Section 1.2.3 defines residual risk this way, after ISO Guide 73. MANAGE 1.4
      instead calls negative residual risks the sum of all unmitigated risks.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:ResidualRisk
    is_a: AiRmfRisk
    slots:
    - ai_rmf_id
    - title
    - description
    - ai_rmf_likelihood
    - ai_rmf_magnitude
    - aiRmfRisk__ai_rmf_risk_system
    - aiRmfRisk__ai_rmf_risk_impacts
    - aiRmfRisk__ai_rmf_risk_characteristics
    - aiRmfRisk__ai_rmf_risk_lifecycle_stages
    - aiRmfRisk__ai_rmf_risk_responses
    - aiRmfRisk__ai_rmf_risk_priority
    - aiRmfRisk__ai_rmf_risk_tolerance
    class_uri: nist_ai_100_1:ResidualRisk
  AiRmfImpact:
    name: AiRmfImpact
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfImpact
    description: A consequence of an AI system, which may be an opportunity, a threat
      or both.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:Impact
    is_a: AiRmfRecord
    slots:
    - ai_rmf_id
    - title
    - description
    - ai_rmf_likelihood
    - ai_rmf_magnitude
    - aiRmfImpact__ai_rmf_impact_direction
    - aiRmfImpact__ai_rmf_impact_affected_parties
    attributes:
      ai_rmf_impact_direction:
        name: ai_rmf_impact_direction
        description: Whether the consequence is positive, negative or both.
        range: AiRmfImpactDirection
        required: true
      ai_rmf_impact_affected_parties:
        name: ai_rmf_impact_affected_parties
        description: Who or what experiences the consequence.
        range: AiRmfAffectedParty
        multivalued: true
    class_uri: nist_ai_100_1:Impact
  AiRmfHarm:
    name: AiRmfHarm
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfHarm
    description: A negative impact, sorted as in Figure 1 by whether it falls on people,
      an organization or an ecosystem.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:Harm
    is_a: AiRmfImpact
    slots:
    - ai_rmf_id
    - title
    - description
    - ai_rmf_likelihood
    - ai_rmf_magnitude
    - aiRmfImpact__ai_rmf_impact_direction
    - aiRmfImpact__ai_rmf_impact_affected_parties
    - aiRmfHarm__ai_rmf_harm_category
    - aiRmfHarm__ai_rmf_harm_example
    attributes:
      ai_rmf_harm_category:
        name: ai_rmf_harm_category
        description: The heading of Figure 1 the harm falls under.
        range: AiRmfHarmCategory
        required: true
      ai_rmf_harm_example:
        name: ai_rmf_harm_example
        description: The example of Figure 1 the harm matches, which must sit under
          the harm's category.
        range: AiRmfHarmExample
    class_uri: nist_ai_100_1:Harm
    rules:
    - preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            name: ai_rmf_harm_category
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_impact_direction:
            name: ai_rmf_impact_direction
            equals_string: negative
      description: A harm is a negative impact.
    - preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            name: ai_rmf_harm_category
            equals_string: people
          ai_rmf_harm_example:
            name: ai_rmf_harm_example
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_harm_example:
            name: ai_rmf_harm_example
            any_of:
            - equals_string: individual
            - equals_string: group_or_community
            - equals_string: societal
      description: An example of harm to people goes with harm to people.
    - preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            name: ai_rmf_harm_category
            equals_string: organization
          ai_rmf_harm_example:
            name: ai_rmf_harm_example
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_harm_example:
            name: ai_rmf_harm_example
            any_of:
            - equals_string: business_operations
            - equals_string: security_breach_or_monetary_loss
            - equals_string: reputation
      description: An example of harm to an organization goes with harm to an organization.
    - preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            name: ai_rmf_harm_category
            equals_string: ecosystem
          ai_rmf_harm_example:
            name: ai_rmf_harm_example
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_harm_example:
            name: ai_rmf_harm_example
            any_of:
            - equals_string: interdependent_elements
            - equals_string: financial_or_supply_systems
            - equals_string: natural_resources_and_environment
      description: An example of harm to an ecosystem goes with harm to an ecosystem.
  AiRmfRiskTolerance:
    name: AiRmfRiskTolerance
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfRiskTolerance
    description: An organization's or AI actor's readiness to bear risk to achieve
      its objectives. The AI RMF prescribes none.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:RiskTolerance
    is_a: AiRmfRecord
    slots:
    - ai_rmf_id
    - title
    - description
    - aiRmfRiskTolerance__ai_rmf_risk_tolerance_holder
    - aiRmfRiskTolerance__ai_rmf_risk_tolerance_influences
    attributes:
      ai_rmf_risk_tolerance_holder:
        name: ai_rmf_risk_tolerance_holder
        description: The organization or AI actor whose tolerance this is.
        range: AiRmfActor
      ai_rmf_risk_tolerance_influences:
        name: ai_rmf_risk_tolerance_influences
        description: What influences it, such as a law, a regulation, a policy or
          a norm.
        multivalued: true
    class_uri: nist_ai_100_1:RiskTolerance
  AiRmfBias:
    name: AiRmfBias
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfBias
    description: A bias to consider and manage, sorted into NIST's three major categories.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    see_also:
    - https://doi.org/10.6028/NIST.SP.1270
    exact_mappings:
    - nist_ai_100_1:Bias
    is_a: AiRmfRecord
    slots:
    - ai_rmf_id
    - title
    - description
    - aiRmfBias__ai_rmf_bias_categories
    attributes:
      ai_rmf_bias_categories:
        name: ai_rmf_bias_categories
        description: The categories it falls under.
        range: AiRmfBiasCategory
        required: true
        multivalued: true
        minimum_cardinality: 1
    class_uri: nist_ai_100_1:Bias
  AiRmfFunction:
    name: AiRmfFunction
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfFunction
    description: One of the four functions that organize AI risk management at the
      highest level. GOVERN cuts across the other three.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    exact_mappings:
    - nist_ai_100_1:Function
    related_mappings:
    - nist_csf_v2:Function
    broad_mappings:
    - oscal:Group
    slots:
    - ai_rmf_function_id
    - AiRmfFunction_description
    - aiRmfFunction__ai_rmf_function_categories
    slot_usage:
      description:
        name: description
        description: The one-sentence overview in NIST's catalog. The publication
          gives each function a section of its own instead.
    attributes:
      ai_rmf_function_categories:
        name: ai_rmf_function_categories
        description: The categories of the function. A knowledge bundle relates a
          category to its function with isPartOf instead.
        range: AiRmfCategory
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_ai_100_1:Function
  AiRmfCategory:
    name: AiRmfCategory
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfCategory
    description: A group of related outcomes within a function, such as GOVERN 1,
      which Tables 1 to 4 state.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    exact_mappings:
    - nist_ai_100_1:Category
    related_mappings:
    - nist_csf_v2:Category
    broad_mappings:
    - oscal:Control
    slots:
    - ai_rmf_category_id
    - AiRmfCategory_description
    - aiRmfCategory__ai_rmf_category_subcategories
    slot_usage:
      description:
        name: description
        description: The category's statement in the publication.
        required: true
        pattern: ^\s*\S
    attributes:
      ai_rmf_category_subcategories:
        name: ai_rmf_category_subcategories
        description: The subcategories of the category. A knowledge bundle relates
          a subcategory to its category with isPartOf instead.
        range: AiRmfSubcategory
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_ai_100_1:Category
  AiRmfSubcategory:
    name: AiRmfSubcategory
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfSubcategory
    description: A specific outcome within a category, such as GOVERN 1.1, which Tables
      1 to 4 state, and its Playbook material.
    comments:
    - Everything but the identifier and the statement comes from the Playbook, a companion
      NIST updates apart from the publication.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    exact_mappings:
    - nist_ai_100_1:Subcategory
    related_mappings:
    - nist_csf_v2:Subcategory
    broad_mappings:
    - oscal:Control
    slots:
    - ai_rmf_subcategory_id
    - AiRmfSubcategory_description
    - aiRmfSubcategory__ai_rmf_subcategory_about
    - aiRmfSubcategory__ai_rmf_subcategory_suggested_actions
    - aiRmfSubcategory__ai_rmf_subcategory_documentation
    - aiRmfSubcategory__ai_rmf_subcategory_transparency_resources
    - aiRmfSubcategory__ai_rmf_subcategory_references
    - aiRmfSubcategory__ai_rmf_subcategory_ai_actors
    - aiRmfSubcategory__ai_rmf_subcategory_topics
    slot_usage:
      description:
        name: description
        description: The subcategory's statement in the publication.
        required: true
        pattern: ^\s*\S
    attributes:
      ai_rmf_subcategory_about:
        name: ai_rmf_subcategory_about
        description: The Playbook's discussion of the outcome.
        multivalued: true
      ai_rmf_subcategory_suggested_actions:
        name: ai_rmf_subcategory_suggested_actions
        description: The steps the Playbook suggests towards the outcome. They are
          voluntary and are not a checklist.
        range: AiRmfSuggestedAction
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_documentation:
        name: ai_rmf_subcategory_documentation
        description: What the Playbook suggests an organization document, mostly as
          questions.
        range: AiRmfDocumentationItem
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_transparency_resources:
        name: ai_rmf_subcategory_transparency_resources
        description: The sources the Playbook names as AI transparency resources.
        range: AiRmfResource
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_references:
        name: ai_rmf_subcategory_references
        description: The Playbook's references for the outcome.
        range: AiRmfResource
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_ai_actors:
        name: ai_rmf_subcategory_ai_actors
        description: The AI actors the Playbook tags the outcome with.
        range: AiRmfActorTaskName
        multivalued: true
      ai_rmf_subcategory_topics:
        name: ai_rmf_subcategory_topics
        description: The topics the Playbook tags the outcome with. NIST keeps no
          closed list of them.
        multivalued: true
    class_uri: nist_ai_100_1:Subcategory
  AiRmfSuggestedAction:
    name: AiRmfSuggestedAction
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfSuggestedAction
    description: One step the Playbook suggests towards a subcategory's outcome.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    exact_mappings:
    - nist_ai_100_1:SuggestedAction
    broad_mappings:
    - oscal:Part
    slots:
    - ai_rmf_suggested_action_id
    - AiRmfSuggestedAction_description
    slot_usage:
      description:
        name: description
        required: true
        pattern: ^\s*\S
    class_uri: nist_ai_100_1:SuggestedAction
  AiRmfDocumentationItem:
    name: AiRmfDocumentationItem
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfDocumentationItem
    description: One thing the Playbook suggests an organization document for a subcategory.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    exact_mappings:
    - nist_ai_100_1:DocumentationItem
    broad_mappings:
    - oscal:Part
    slots:
    - ai_rmf_documentation_id
    - AiRmfDocumentationItem_description
    slot_usage:
      description:
        name: description
        required: true
        pattern: ^\s*\S
    class_uri: nist_ai_100_1:DocumentationItem
  AiRmfResource:
    name: AiRmfResource
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfResource
    description: A source the Playbook points to, by the title and address NIST's
      catalog gives it.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    exact_mappings:
    - nist_ai_100_1:Resource
    broad_mappings:
    - oscal:Resource
    slots:
    - AiRmfResource_title
    - aiRmfResource__ai_rmf_resource_uuid
    - aiRmfResource__ai_rmf_resource_address
    slot_usage:
      title:
        name: title
        required: true
    attributes:
      ai_rmf_resource_uuid:
        name: ai_rmf_resource_uuid
        description: The UUID of the resource in the back matter of NIST's catalog.
        required: true
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      ai_rmf_resource_address:
        name: ai_rmf_resource_address
        description: The address NIST's catalog gives the source. The catalog gives
          none for a few.
        range: uri
    class_uri: nist_ai_100_1:Resource
  AiRmfProfile:
    name: AiRmfProfile
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfProfile
    description: An implementation of the Core's functions, categories and subcategories
      for a setting, application or technology, based on the adopter's requirements,
      risk tolerance and resources.
    comments:
    - The publication prescribes no profile template, so only the kinds and the subcategories
      are structured.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_profiles
    exact_mappings:
    - nist_ai_100_1:Profile
    related_mappings:
    - oscal:Profile
    is_a: AiRmfRecord
    slots:
    - ai_rmf_id
    - title
    - description
    - aiRmfProfile__ai_rmf_profile_kinds
    - aiRmfProfile__ai_rmf_profile_setting
    - aiRmfProfile__ai_rmf_profile_subcategories
    attributes:
      ai_rmf_profile_kinds:
        name: ai_rmf_profile_kinds
        description: Which of the publication's kinds of profile this is. A current
          profile for one use case is both.
        range: AiRmfProfileKind
        required: true
        multivalued: true
        minimum_cardinality: 1
      ai_rmf_profile_setting:
        name: ai_rmf_profile_setting
        description: The sector, industry, technology, organization or end use the
          profile covers, such as hiring.
      ai_rmf_profile_subcategories:
        name: ai_rmf_profile_subcategories
        description: The subcategories the profile selects. An adopter may select
          from them rather than apply all.
        range: ai_rmf_subcategory_identifier
        multivalued: true
    class_uri: nist_ai_100_1:Profile
  GaiRisk:
    name: GaiRisk
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRisk
    description: A risk that section 2 defines as unique to or made worse by the development
      and use of GAI.
    comments:
    - The publication gives a risk its section, its definition, its trustworthiness
      characteristics and, in a footnote, its groupings. It assigns no lifecycle stage,
      scope, source or time scale to a risk, since those depend on the model, system
      or use case. An adopter fills them in.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    exact_mappings:
    - nist_ai_600_1:Risk
    related_mappings:
    - nist_ai_100_1:Risk
    slots:
    - GaiRisk_description
    - gaiRisk__gai_risk_name
    - gaiRisk__gai_risk_section
    - gaiRisk__gai_risk_characteristics
    - gaiRisk__gai_risk_groupings
    - gaiRisk__gai_risk_lifecycle_stages
    - gaiRisk__gai_risk_scopes
    - gaiRisk__gai_risk_sources
    - gaiRisk__gai_risk_time_scales
    slot_usage:
      description:
        name: description
        description: The risk's definition in section 2.
    attributes:
      gai_risk_name:
        name: gai_risk_name
        description: Which of the 12 risks this is.
        range: GaiRiskName
        required: true
      gai_risk_section:
        name: gai_risk_section
        description: The subsection of section 2 that discusses the risk, such as
          2.1.
        required: true
        pattern: ^2\.([1-9]|1[0-2])$
      gai_risk_characteristics:
        name: gai_risk_characteristics
        description: The AI RMF's trustworthiness characteristics that the subsection
          names for the risk.
        range: AiRmfCharacteristicName
        multivalued: true
      gai_risk_groupings:
        name: gai_risk_groupings
        description: The groups footnote 5 suggests for the risk. The footnote lists
          Data Privacy under all three.
        range: GaiRiskGrouping
        multivalued: true
      gai_risk_lifecycle_stages:
        name: gai_risk_lifecycle_stages
        description: The lifecycle stages where the risk can arise for the adopter's
          model, system or use case.
        range: GaiLifecycleStage
        multivalued: true
      gai_risk_scopes:
        name: gai_risk_scopes
        description: The levels where the risk exists for the adopter's model, system
          or use case.
        range: GaiRiskScope
        multivalued: true
      gai_risk_sources:
        name: gai_risk_sources
        description: Where the risk comes from for the adopter's model, system or
          use case.
        range: GaiRiskSource
        multivalued: true
      gai_risk_time_scales:
        name: gai_risk_time_scales
        description: How the risk materializes over time for the adopter's model,
          system or use case.
        range: GaiRiskTimeScale
        multivalued: true
    class_uri: nist_ai_600_1:Risk
  GaiSubcategory:
    name: GaiSubcategory
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiSubcategory
    description: An AI RMF subcategory as one table of section 3 addresses it. The
      Profile covers only some of the 72.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_actions
    exact_mappings:
    - nist_ai_600_1:Subcategory
    related_mappings:
    - nist_ai_100_1:Subcategory
    slots:
    - ai_rmf_subcategory_id
    - GaiSubcategory_description
    - gaiSubcategory__gai_subcategory_actions
    - gaiSubcategory__gai_subcategory_actor_tasks
    slot_usage:
      description:
        name: description
        description: The subcategory's statement as the table restates it.
        required: true
        pattern: ^\s*\S
    attributes:
      gai_subcategory_actions:
        name: gai_subcategory_actions
        description: The suggested actions the table lists.
        range: GaiSuggestedAction
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      gai_subcategory_actor_tasks:
        name: gai_subcategory_actor_tasks
        description: 'The AI actor tasks the table names. They belong to the table
          and not to one action: the publication says not every task applies to every
          action.'
        range: AiRmfActorTaskName
        multivalued: true
    class_uri: nist_ai_600_1:Subcategory
  GaiSuggestedAction:
    name: GaiSuggestedAction
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiSuggestedAction
    description: A step an organization or AI actor can take to manage GAI risks,
      which one row of a table states.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_actions
    exact_mappings:
    - nist_ai_600_1:SuggestedAction
    related_mappings:
    - nist_ai_100_1:SuggestedAction
    - stix:StixCourseOfAction
    broad_mappings:
    - oscal:Part
    slots:
    - gai_action_id
    - GaiSuggestedAction_description
    - gaiSuggestedAction__gai_action_risks
    slot_usage:
      description:
        name: description
        description: The action's text in the table.
        required: true
        pattern: ^\s*\S
    attributes:
      gai_action_risks:
        name: gai_action_risks
        description: The GAI risks the row tags the action with.
        range: GaiRiskName
        multivalued: true
    class_uri: nist_ai_600_1:SuggestedAction
  GaiPrimaryConsideration:
    name: GaiPrimaryConsideration
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiPrimaryConsideration
    description: One of the four primary considerations of Appendix A, which also
      inform the suggested actions.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:PrimaryConsideration
    abstract: true
    slots:
    - gai_consideration_type
    - GaiPrimaryConsideration_title
    - description
    - gaiPrimaryConsideration__gai_consideration_sections
    slot_usage:
      title:
        name: title
        required: true
    attributes:
      gai_consideration_sections:
        name: gai_consideration_sections
        description: The subsections of Appendix A that discuss the consideration,
          such as A.1.2.
        multivalued: true
        pattern: ^A\.1(\.[1-8])?$
    class_uri: nist_ai_600_1:PrimaryConsideration
  GaiGovernanceConsideration:
    name: GaiGovernanceConsideration
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiGovernanceConsideration
    description: How an organization's governance can be revisited for GAI, including
      across the AI value chain.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:GovernanceConsideration
    is_a: GaiPrimaryConsideration
    slots:
    - gai_consideration_type
    - GaiPrimaryConsideration_title
    - description
    - gaiPrimaryConsideration__gai_consideration_sections
    - gaiGovernanceConsideration__gai_governance_plans
    - gaiGovernanceConsideration__gai_third_party_controls
    attributes:
      gai_governance_plans:
        name: gai_governance_plans
        description: The plans and actions that section A.1.2 lists from other AI
          governance.
        range: GaiGovernancePlan
        multivalued: true
      gai_third_party_controls:
        name: gai_third_party_controls
        description: The existing controls that section A.1.3 says can apply to third-party
          GAI.
        range: GaiThirdPartyControl
        multivalued: true
    class_uri: nist_ai_600_1:GovernanceConsideration
  GaiPreDeploymentTestingConsideration:
    name: GaiPreDeploymentTestingConsideration
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiPreDeploymentTestingConsideration
    description: How GAI can be tested before deployment while better approaches mature,
      and where current tests fall short.
    comments:
    - Section A.1.7 calls the feedback approaches of section A.1.5 part of this consideration.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:PreDeploymentTestingConsideration
    is_a: GaiPrimaryConsideration
    slots:
    - gai_consideration_type
    - GaiPrimaryConsideration_title
    - description
    - gaiPrimaryConsideration__gai_consideration_sections
    - gaiPreDeploymentTestingConsideration__gai_structured_feedback
    attributes:
      gai_structured_feedback:
        name: gai_structured_feedback
        description: The kinds of structured public feedback section A.1.5 gives as
          examples.
        range: GaiStructuredFeedback
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_ai_600_1:PreDeploymentTestingConsideration
  GaiContentProvenanceConsideration:
    name: GaiContentProvenanceConsideration
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiContentProvenanceConsideration
    description: How tracking the origin and history of content helps tell authentic
      content from synthetic content.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:ContentProvenanceConsideration
    is_a: GaiPrimaryConsideration
    slots:
    - gai_consideration_type
    - GaiPrimaryConsideration_title
    - description
    - gaiPrimaryConsideration__gai_consideration_sections
    - gaiContentProvenanceConsideration__gai_provenance_techniques
    attributes:
      gai_provenance_techniques:
        name: gai_provenance_techniques
        description: The well-known techniques for provenance data tracking that section
          A.1.6 names.
        range: GaiProvenanceTechnique
        multivalued: true
    class_uri: nist_ai_600_1:ContentProvenanceConsideration
  GaiIncidentDisclosureConsideration:
    name: GaiIncidentDisclosureConsideration
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiIncidentDisclosureConsideration
    description: How documenting, reporting and sharing AI incidents helps prevent
      harm, though no formal channels exist.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:IncidentDisclosureConsideration
    is_a: GaiPrimaryConsideration
    slots:
    - gai_consideration_type
    - GaiPrimaryConsideration_title
    - description
    - gaiPrimaryConsideration__gai_consideration_sections
    - gaiIncidentDisclosureConsideration__gai_incident_harms
    attributes:
      gai_incident_harms:
        name: gai_incident_harms
        description: The kinds of harm that section A.1.8's definition of an AI incident
          names.
        range: GaiIncidentHarm
        multivalued: true
    class_uri: nist_ai_600_1:IncidentDisclosureConsideration
  GaiStructuredFeedback:
    name: GaiStructuredFeedback
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiStructuredFeedback
    description: A way of using structured public feedback to evaluate whether GAI
      systems perform as intended.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:StructuredFeedback
    abstract: true
    slots:
    - gai_feedback_type
    - GaiStructuredFeedback_title
    - description
    slot_usage:
      title:
        name: title
        required: true
    class_uri: nist_ai_600_1:StructuredFeedback
  GaiParticipatoryEngagement:
    name: GaiParticipatoryEngagement
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiParticipatoryEngagement
    description: Asking civil society groups, affected communities and users for feedback,
      such as through focus groups or surveys.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:ParticipatoryEngagement
    is_a: GaiStructuredFeedback
    slots:
    - gai_feedback_type
    - GaiStructuredFeedback_title
    - description
    class_uri: nist_ai_600_1:ParticipatoryEngagement
  GaiFieldTesting:
    name: GaiFieldTesting
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiFieldTesting
    description: Structured settings that show how people interact with and use AI-generated
      information.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:FieldTesting
    is_a: GaiStructuredFeedback
    slots:
    - gai_feedback_type
    - GaiStructuredFeedback_title
    - description
    class_uri: nist_ai_600_1:FieldTesting
  GaiAiRedTeaming:
    name: GaiAiRedTeaming
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiAiRedTeaming
    description: A structured exercise that probes an AI system for flaws and vulnerabilities,
      often with its developers.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    exact_mappings:
    - nist_ai_600_1:AiRedTeaming
    is_a: GaiStructuredFeedback
    slots:
    - gai_feedback_type
    - GaiStructuredFeedback_title
    - description
    - gaiAiRedTeaming__gai_red_teaming_types
    attributes:
      gai_red_teaming_types:
        name: gai_red_teaming_types
        description: The kinds of AI red-teaming that may suit the use case.
        range: GaiRedTeamingType
        multivalued: true
    class_uri: nist_ai_600_1:AiRedTeaming
