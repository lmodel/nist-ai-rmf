name: nist_ai_rmf
description: 'One LinkML schema for two NIST publications: the AI Risk Management
  Framework 1.0 (NIST AI 100-1) and its Generative AI Profile (NIST AI 600-1).'
title: NIST AI Risk Management Framework family
comments:
- The version is the 1.0.0 both publications carry, and source is NIST's page for
  the framework. The release tags are the schema's own versions.
- Every module of lmodel/nist-ai-100-1 and lmodel/nist-ai-600-1 is vendored in this
  folder as released, so the schema needs no network, and tests/test_upstream.py holds
  them to their hashes. Each element keeps the IRI of its publication, and this schema
  adds only the class below.
- The AI RMF to ISO/IEC 42001 crosswalk pairs records, not schema elements, so it
  is no mapping of this schema. scripts/build_crosswalk.py writes it as SSSOM under
  tmp/, and the repository carries neither it nor its PDF, which states no licence.
source: https://www.nist.gov/itl/ai-risk-management-framework
see_also:
- https://lmodel.github.io/nist-ai-rmf
- https://w3id.org/lmodel/nist-ai-100-1
- https://w3id.org/lmodel/nist-ai-600-1
id: https://w3id.org/lmodel/nist-ai-rmf
version: 1.0.0
imports:
- linkml:types
- ./nist_ai_100_1/nist_ai_100_1
- ./nist_ai_600_1
- nist_ai_100_1/nist_ai_100_1_base
- nist_ai_100_1/nist_ai_100_1_foundations
- nist_ai_100_1/nist_ai_100_1_rmf_core
- nist_ai_100_1/nist_ai_100_1_profiles
- nist_ai_100_1/nist_ai_100_1_base
- nist_ai_100_1/nist_ai_100_1_profiles
- nist_ai_600_1_risks
- nist_ai_600_1_actions
- nist_ai_600_1_considerations
- nist_ai_100_1/nist_ai_100_1_base
- nist_ai_100_1/nist_ai_100_1_base
- nist_ai_100_1/nist_ai_100_1_base
- nist_ai_100_1/nist_ai_100_1_base
- nist_ai_100_1/nist_ai_100_1_base
- nist_ai_600_1_risks
- nist_ai_100_1/nist_ai_100_1_base
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  nist_ai_rmf:
    prefix_prefix: nist_ai_rmf
    prefix_reference: https://w3id.org/lmodel/nist-ai-rmf/
default_prefix: nist_ai_rmf
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  ai_rmf_function_identifier:
    name: ai_rmf_function_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfFunctionIdentifier
    description: The name of one of the four Core functions, written in capitals,
      such as GOVERN.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GOVERN|MAP|MEASURE|MANAGE)$
  ai_rmf_category_identifier:
    name: ai_rmf_category_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfCategoryIdentifier
    description: A category's identifier, its function's name and a number, such as
      GOVERN 1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])$
  ai_rmf_subcategory_identifier:
    name: ai_rmf_subcategory_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfSubcategoryIdentifier
    description: A subcategory's identifier, its category's identifier, a dot and
      a number, such as GOVERN 1.1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])\.[1-9][0-9]?$
  ai_rmf_suggested_action_identifier:
    name: ai_rmf_suggested_action_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfSuggestedActionIdentifier
    description: The identifier NIST's catalog gives a Playbook suggested action,
      such as SA-GOVERN_1.1-1. Each further number, as in SA-GOVERN_1.4-1.2, marks
      a sub-item.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^SA-(GOVERN|MAP|MEASURE|MANAGE)_[1-6]\.[1-9][0-9]?-[1-9][0-9]?(\.[1-9][0-9]?)*$
  ai_rmf_documentation_identifier:
    name: ai_rmf_documentation_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfDocumentationIdentifier
    description: The identifier NIST's catalog gives a Playbook documentation prompt,
      such as D-GOVERN_1.1-1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_rmf_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^D-(GOVERN|MAP|MEASURE|MANAGE)_[1-6]\.[1-9][0-9]?-[1-9][0-9]?$
  gai_action_identifier:
    name: gai_action_identifier
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiActionIdentifier
    description: 'An Action ID: the function''s two letters, its subcategory''s numbers
      and a three-digit number, such as GV-1.1-001 for the first action of GOVERN
      1.1.'
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_actions
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV-[1-6]|MP-[1-5]|MS-[1-4]|MG-[1-4])\.[1-9][0-9]?-[0-9]{3}$
enums:
  AiRmfCharacteristicName:
    name: AiRmfCharacteristicName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfCharacteristicName
    description: The seven characteristics of trustworthy AI systems in section 3
      of the publication.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    permissible_values:
      valid_and_reliable:
        text: valid_and_reliable
        description: Shown by evidence to meet the needs of its intended use, and
          works without failure over time. Figure 4 makes it a necessary condition
          for the others.
        title: Valid and Reliable
      safe:
        text: safe
        description: Keeps people, property and the environment out of danger under
          defined conditions.
        title: Safe
      secure_and_resilient:
        text: secure_and_resilient
        description: Withstands adverse events and recovers from them, and keeps confidentiality,
          integrity and availability through protections against attack.
        title: Secure and Resilient
      accountable_and_transparent:
        text: accountable_and_transparent
        description: Answerable for outcomes, which rests on people being able to
          get information about the system and its outputs. Figure 4 shows it relating
          to all the others.
        title: Accountable and Transparent
      explainable_and_interpretable:
        text: explainable_and_interpretable
        description: Its working can be represented (how a decision was made) and
          its output understood in context (why, and what it means for the user).
        title: Explainable and Interpretable
      privacy_enhanced:
        text: privacy_enhanced
        description: Guided by the norms and practices that protect human autonomy,
          identity and dignity, such as anonymity, confidentiality and control.
        title: Privacy-Enhanced
      fair_with_harmful_bias_managed:
        text: fair_with_harmful_bias_managed
        description: Addresses equality and equity, including harmful bias and discrimination,
          knowing that views of fairness differ across cultures and applications.
        title: "Fair \u2013 with Harmful Bias Managed"
  AiRmfActorTaskName:
    name: AiRmfActorTaskName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfActorTaskName
    description: The ten AI actor tasks and five additional AI actors of Appendix
      A.
    comments:
    - 'One list holds both kinds because NIST tags them together: the Playbook under
      its AI Actors key, and AI 600-1 under AI Actor Tasks. Each alias is the spelling
      those tags use where it differs from the title in Appendix A.'
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_base
    permissible_values:
      ai_design:
        text: ai_design
        description: Setting what the system is for, planning and designing it, and
          gathering and preparing its data.
        title: AI Design
      ai_development:
        text: ai_development
        description: Providing the initial infrastructure, and creating, selecting,
          calibrating, training and testing models.
        title: AI Development
      ai_deployment:
        text: ai_deployment
        description: Deciding how the system is used and putting it into production,
          including pilots and compliance checks.
        title: AI Deployment
      operation_and_monitoring:
        text: operation_and_monitoring
        description: Running the system and regularly assessing its output and impacts.
        title: Operation and Monitoring
      tevv:
        text: tevv
        description: Examining the system or its components and finding and fixing
          problems, throughout the lifecycle.
        title: Test, Evaluation, Verification, and Validation (TEVV)
        aliases:
        - TEVV
      human_factors:
        text: human_factors
        description: Human-centered design and evaluation, involving end users and
          bringing context-specific norms and values into design.
        title: Human Factors
      domain_expert:
        text: domain_expert
        description: Giving knowledge of the sector or setting where the system is
          used.
        title: Domain Expert
        aliases:
        - Domain Experts
      ai_impact_assessment:
        text: ai_impact_assessment
        description: Assessing accountability, harmful bias, impacts, product safety,
          liability and security.
        title: AI Impact Assessment
      procurement:
        text: procurement
        description: Acquiring AI from another party, under financial, legal or policy
          authority.
        title: Procurement
      governance_and_oversight:
        text: governance_and_oversight
        description: Holding management, fiduciary and legal authority for the organization
          where the system is designed, developed or deployed.
        title: Governance and Oversight
      third_party_entities:
        text: third_party_entities
        description: Outside organizations that supply or evaluate the data, models,
          systems or services an organization acquires.
        title: Third-party entities
      end_users:
        text: end_users
        description: The people or groups who use the system, whether new to technology
          or expert in AI.
        title: End users
        aliases:
        - End-Users
        - End Users
      affected_individuals_and_communities:
        text: affected_individuals_and_communities
        description: Those directly or indirectly affected by the system or its output,
          whether or not they interact with it.
        title: Affected individuals/communities
        aliases:
        - Affected Individuals and Communities
      other_ai_actors:
        text: other_ai_actors
        description: Those who may provide norms or guidance on AI risk, such as standards
          bodies, advocacy groups and researchers.
        title: Other AI actors
      general_public:
        text: general_public
        description: Those most likely to experience the impacts directly, who may
          motivate what other AI actors do.
        title: General public
  AiRmfDimensionName:
    name: AiRmfDimensionName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfDimensionName
    description: The key dimensions of an AI system in Figure 2.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      application_context:
        text: application_context
        description: The setting the system is planned for and operated in.
        title: Application Context
      data_and_input:
        text: data_and_input
        description: The data the system is built from and takes in.
        title: Data and Input
      ai_model:
        text: ai_model
        description: The models built, used, verified and validated.
        title: AI Model
      task_and_output:
        text: task_and_output
        description: What the system does and produces once deployed.
        title: Task and Output
      people_and_planet:
        text: people_and_planet
        description: Human rights and the well-being of society and the planet, at
          the center of Figure 2.
        title: People and Planet
  AiRmfLifecycleStageName:
    name: AiRmfLifecycleStageName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfLifecycleStageName
    description: The AI lifecycle stages in Figure 3, of which Figure 2 shows the
      first six.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      plan_and_design:
        text: plan_and_design
        description: Documenting the concept, objectives, assumptions, context and
          requirements.
        title: Plan and Design
      collect_and_process_data:
        text: collect_and_process_data
        description: Gathering, validating and cleaning data, and recording what it
          holds.
        title: Collect and Process Data
      build_and_use_model:
        text: build_and_use_model
        description: Creating or selecting algorithms and training models.
        title: Build and Use Model
      verify_and_validate:
        text: verify_and_validate
        description: Verifying, validating, calibrating and interpreting model output.
        title: Verify and Validate
      deploy_and_use:
        text: deploy_and_use
        description: Piloting, checking compatibility and compliance, managing change
          and evaluating user experience.
        title: Deploy and Use
      operate_and_monitor:
        text: operate_and_monitor
        description: Operating the system and continually assessing its recommendations
          and impacts.
        title: Operate and Monitor
      use_or_impacted_by:
        text: use_or_impacted_by
        description: Using the technology or being affected by it, which Figure 3
          places under People and Planet.
        title: Use or Impacted by
  AiRmfAudience:
    name: AiRmfAudience
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfAudience
    description: The two AI RMF audiences of section 2.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      primary:
        text: primary
        description: AI actors who carry out or manage work on AI systems and drive
          their risk management.
        title: Primary audience
      informing:
        text: informing
        description: AI actors in the People and Planet dimension, who inform the
          primary audience.
        title: Informing audience
  AiRmfManagementChallengeName:
    name: AiRmfManagementChallengeName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfManagementChallengeName
    description: The challenges for AI risk management in section 1.2.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      risk_measurement:
        text: risk_measurement
        description: AI risks that are poorly defined or understood are hard to measure,
          which does not mean they are high or low.
        title: Risk Measurement
      risk_tolerance:
        text: risk_tolerance
        description: The AI RMF can prioritize risk but prescribes no tolerance, which
          depends on context and changes over time.
        title: Risk Tolerance
      risk_prioritization:
        text: risk_prioritization
        description: Eliminating all negative risk is unrealistic, so effort goes
          first to the highest risks in a context of use.
        title: Risk Prioritization
      organizational_integration_and_management_of_risk:
        text: organizational_integration_and_management_of_risk
        description: AI risk belongs inside broader enterprise risk management, with
          accountability and commitment from senior levels.
        title: Organizational Integration and Management of Risk
  AiRmfMeasurementChallengeName:
    name: AiRmfMeasurementChallengeName
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfMeasurementChallengeName
    description: The challenges of measuring AI risk in section 1.2.1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      third_party_software_hardware_and_data:
        text: third_party_software_hardware_and_data
        description: Third-party parts can speed work, but their metrics may not match
          or be disclosed, and how they are used adds risk.
        title: Risks related to third-party software, hardware, and data
      tracking_emergent_risks:
        text: tracking_emergent_risks
        description: New risks need identifying, tracking and measuring, which impact
          assessment helps with.
        title: Tracking emergent risks
      availability_of_reliable_metrics:
        text: availability_of_reliable_metrics
        description: There is no consensus on robust, verifiable methods, and metrics
          can be oversimplified or gamed.
        title: Availability of reliable metrics
      risk_at_different_lifecycle_stages:
        text: risk_at_different_lifecycle_stages
        description: Results differ by stage, some risks stay latent, and AI actors
          see risk differently.
        title: Risk at different stages of the AI lifecycle
      risk_in_real_world_settings:
        text: risk_in_real_world_settings
        description: What a laboratory measures may differ from what emerges in operation.
        title: Risk in real-world settings
      inscrutability:
        text: inscrutability
        description: Opaque systems, poor documentation and inherent uncertainty complicate
          measurement.
        title: Inscrutability
      human_baseline:
        text: human_baseline
        description: A system that augments or replaces human activity needs a baseline,
          which is hard to systematize.
        title: Human baseline
  AiRmfRiskResponse:
    name: AiRmfRiskResponse
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfRiskResponse
    description: The risk response options MANAGE 1.3 names.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      mitigating:
        text: mitigating
        description: Reducing the likelihood or magnitude of the risk.
        title: Mitigating
      transferring:
        text: transferring
        description: Shifting the risk to another party.
        title: Transferring
      avoiding:
        text: avoiding
        description: Not carrying out what creates the risk.
        title: Avoiding
      accepting:
        text: accepting
        description: Bearing the risk without further action.
        title: Accepting
  AiRmfImpactDirection:
    name: AiRmfImpactDirection
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfImpactDirection
    description: Whether an impact is positive, negative or both, as section 1.1 puts
      it.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      positive:
        text: positive
        description: An opportunity or benefit.
        title: Positive
      negative:
        text: negative
        description: A threat or harm.
        title: Negative
      both:
        text: both
        description: Positive and negative at once.
        title: Both
  AiRmfAffectedParty:
    name: AiRmfAffectedParty
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfAffectedParty
    description: Who section 1.1 says can experience negative impact or harm.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      individuals:
        text: individuals
        description: Particular people.
        title: Individuals
      groups:
        text: groups
        description: Groups of people.
        title: Groups
      communities:
        text: communities
        description: Communities of people.
        title: Communities
      organizations:
        text: organizations
        description: Organizations.
        title: Organizations
      society:
        text: society
        description: Society at large.
        title: Society
      environment:
        text: environment
        description: The natural environment.
        title: The environment
      planet:
        text: planet
        description: The planet as a whole.
        title: The planet
  AiRmfHarmCategory:
    name: AiRmfHarmCategory
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfHarmCategory
    description: The three headings of Figure 1.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      people:
        text: people
        description: Harm that falls on individuals, groups, communities or society.
        title: Harm to People
      organization:
        text: organization
        description: Harm that falls on an organization.
        title: Harm to an Organization
      ecosystem:
        text: ecosystem
        description: Harm that falls on interconnected systems and resources.
        title: Harm to an Ecosystem
  AiRmfHarmExample:
    name: AiRmfHarmExample
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfHarmExample
    description: The examples of potential harm in Figure 1, which NIST offers as
      examples and not as a closed list.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    permissible_values:
      individual:
        text: individual
        description: To a person's civil liberties, rights, safety or economic opportunity.
        title: Individual
      group_or_community:
        text: group_or_community
        description: To a group, such as discrimination against a sub-group of a population.
        title: Group/Community
      societal:
        text: societal
        description: To democratic participation or educational access.
        title: Societal
      business_operations:
        text: business_operations
        description: To how an organization operates.
        title: Business operations
      security_breach_or_monetary_loss:
        text: security_breach_or_monetary_loss
        description: To an organization through a breach of security or a loss of
          money.
        title: Security breaches or monetary loss
      reputation:
        text: reputation
        description: To an organization's standing.
        title: Reputation
      interdependent_elements:
        text: interdependent_elements
        description: To parts and resources that depend on each other.
        title: Interconnected and interdependent elements and resources
      financial_or_supply_systems:
        text: financial_or_supply_systems
        description: To large systems that link organizations.
        title: Global financial system, supply chain, or interrelated systems
      natural_resources_and_environment:
        text: natural_resources_and_environment
        description: To the natural world.
        title: Natural resources, the environment, and planet
  AiRmfBiasCategory:
    name: AiRmfBiasCategory
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfBiasCategory
    description: The three major categories of AI bias in section 3.7, each of which
      can occur without prejudice or discriminatory intent.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    see_also:
    - https://doi.org/10.6028/NIST.SP.1270
    permissible_values:
      systemic:
        text: systemic
        description: In datasets, in organizational norms and processes, and in the
          wider society that uses AI.
        title: Systemic
      computational_and_statistical:
        text: computational_and_statistical
        description: In datasets and algorithms, often from systematic errors due
          to samples that are not representative.
        title: Computational and statistical
      human_cognitive:
        text: human_cognitive
        description: In how people perceive system information to decide, or think
          about what a system is for.
        title: Human-cognitive
  AiRmfProfileKind:
    name: AiRmfProfileKind
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfProfileKind
    description: The kinds of AI RMF profile that section 6 names.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_profiles
    permissible_values:
      use_case:
        text: use_case
        description: The Core implemented for a specific setting or application.
        title: Use-case profile
      current:
        text: current
        description: A temporal profile saying how AI is managed today and the related
          risks, in terms of current outcomes.
        title: Current Profile
      target:
        text: target
        description: A temporal profile saying which outcomes the desired risk management
          goals need.
        title: Target Profile
      cross_sectoral:
        text: cross_sectoral
        description: Covers risks of models or applications used across use cases
          or sectors, or activities common to them, such as using large language models.
        title: Cross-sectoral profile
  GaiRiskName:
    name: GaiRiskName
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskName
    description: The 12 risks of section 2.
    comments:
    - The tables of section 3 tag actions with these risks, in slightly different
      spellings from the definitions in section 2. Each alias is a spelling the tables
      use.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      cbrn_information_or_capabilities:
        text: cbrn_information_or_capabilities
        description: Easier access to dangerous information or design abilities for
          chemical, biological, radiological or nuclear weapons.
        title: CBRN Information or Capabilities
        aliases:
        - CBRN Information and Capability
      confabulation:
        text: confabulation
        description: Confident but wrong output that can mislead users.
        title: Confabulation
      dangerous_violent_or_hateful_content:
        text: dangerous_violent_or_hateful_content
        description: Easier production of content that incites or threatens, recommends
          harm, or disparages.
        title: Dangerous, Violent, or Hateful Content
      data_privacy:
        text: data_privacy
        description: Leaks, misuse or de-anonymization of personal or sensitive data.
        title: Data Privacy
      environmental_impacts:
        text: environmental_impacts
        description: Effects on ecosystems from the heavy computing that training
          and operating models need.
        title: Environmental Impacts
        aliases:
        - Environmental
      harmful_bias_or_homogenization:
        text: harmful_bias_or_homogenization
        description: Worse systemic bias, unequal performance across groups or languages,
          and output skewed by sameness.
        title: Harmful Bias or Homogenization
        aliases:
        - Harmful Bias and Homogenization
      human_ai_configuration:
        text: human_ai_configuration
        description: Interaction that leads people to over-rely on, anthropomorphize
          or become entangled with a system, or to distrust it.
        title: Human-AI Configuration
        aliases:
        - Human AI Configuration
      information_integrity:
        text: information_integrity
        description: Easier creation and spread of content that blurs fact and opinion,
          or that can drive large disinformation campaigns.
        title: Information Integrity
      information_security:
        text: information_security
        description: Easier offensive cyber activity, and a larger attack surface
          on a system, its data, code or weights.
        title: Information Security
      intellectual_property:
        text: intellectual_property
        description: Easier unauthorized copying of protected content, exposure of
          trade secrets, and plagiarism.
        title: Intellectual Property
      obscene_degrading_or_abusive_content:
        text: obscene_degrading_or_abusive_content
        description: Easier production of harmful imagery, including synthetic abuse
          material and intimate images without consent.
        title: Obscene, Degrading, and/or Abusive Content
      value_chain_and_component_integration:
        text: value_chain_and_component_integration
        description: Opaque use of third-party components and data, and poor supplier
          vetting, that weaken accountability downstream.
        title: Value Chain and Component Integration
  GaiRiskGrouping:
    name: GaiRiskGrouping
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskGrouping
    description: The three groups into which footnote 5 says an organization could
      sort the risks, as one possible way.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      technical_or_model:
        text: technical_or_model
        description: Risks from malfunction.
        title: Technical / Model risks
      misuse_by_humans:
        text: misuse_by_humans
        description: Risks from malicious use.
        title: Misuse by humans
      ecosystem_or_societal:
        text: ecosystem_or_societal
        description: Systemic risks.
        title: Ecosystem / societal risks
  GaiLifecycleStage:
    name: GaiLifecycleStage
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiLifecycleStage
    description: The lifecycle stages section 2 names for GAI. They differ from the
      seven stages of the AI RMF's Figure 3.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      design:
        text: design
        description: Setting out the system before it is built.
        title: Design
      development:
        text: development
        description: Building and training it.
        title: Development
      deployment:
        text: deployment
        description: Putting it into use.
        title: Deployment
      operation:
        text: operation
        description: Running it.
        title: Operation
      decommissioning:
        text: decommissioning
        description: Retiring it.
        title: Decommissioning
  GaiRiskScope:
    name: GaiRiskScope
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskScope
    description: The levels where section 2 says a risk may exist.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      model_or_system:
        text: model_or_system
        description: The level of one model or system.
        title: Model or system
      application_or_implementation:
        text: application_or_implementation
        description: The level of one specific use case.
        title: Application or implementation
      ecosystem:
        text: ecosystem
        description: Beyond one system or organization, such as algorithmic monocultures
          or effects on labor markets.
        title: Ecosystem
  GaiRiskSource:
    name: GaiRiskSource
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskSource
    description: Where section 2 says a risk may come from.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      design:
        text: design
        description: The design of the model itself.
        title: Design
      training:
        text: training
        description: The training of the model.
        title: Training
      operation:
        text: operation
        description: The operation of the model.
        title: Operation
      inputs:
        text: inputs
        description: What goes into the model or system.
        title: Inputs
      outputs:
        text: outputs
        description: What the system produces.
        title: Outputs
      human_behavior:
        text: human_behavior
        description: Abuse, misuse or unsafe repurposing by people, whether adversarial
          or not.
        title: Human behavior
      human_ai_interaction:
        text: human_ai_interaction
        description: How a person and a system act on each other.
        title: Human-AI interaction
  GaiRiskTimeScale:
    name: GaiRiskTimeScale
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRiskTimeScale
    description: How section 2 says a risk may materialize over time.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_risks
    permissible_values:
      abrupt:
        text: abrupt
        description: All at once, such as immediate emotional harm from a harmful
          deepfake image.
        title: Abruptly
      extended:
        text: extended
        description: Slowly, such as the long-term effect of disinformation on trust
          in institutions.
        title: Across extended periods
  GaiGovernancePlan:
    name: GaiGovernancePlan
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiGovernancePlan
    description: The plans and actions that section A.1.2 says apply to GAI from other
      AI governance.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    permissible_values:
      accessibility_and_reasonable_accommodations:
        text: accessibility_and_reasonable_accommodations
        title: Accessibility and reasonable accommodations
      ai_actor_credentials_and_qualifications:
        text: ai_actor_credentials_and_qualifications
        title: AI actor credentials and qualifications
      alignment_to_organizational_values:
        text: alignment_to_organizational_values
        title: Alignment to organizational values
      auditing_and_assessment:
        text: auditing_and_assessment
        title: Auditing and assessment
      change_management_controls:
        text: change_management_controls
        title: Change-management controls
      commercial_use:
        text: commercial_use
        title: Commercial use
      data_provenance:
        text: data_provenance
        title: Data provenance
      data_protection:
        text: data_protection
        title: Data protection
      data_retention:
        text: data_retention
        title: Data retention
      consistency_in_use_of_defining_key_terms:
        text: consistency_in_use_of_defining_key_terms
        title: Consistency in use of defining key terms
      decommissioning:
        text: decommissioning
        title: Decommissioning
      discouraging_anonymous_use:
        text: discouraging_anonymous_use
        title: Discouraging anonymous use
      education:
        text: education
        title: Education
      impact_assessments:
        text: impact_assessments
        title: Impact assessments
      incident_response:
        text: incident_response
        title: Incident response
      monitoring:
        text: monitoring
        title: Monitoring
      opt_outs:
        text: opt_outs
        title: Opt-outs
      risk_based_controls:
        text: risk_based_controls
        title: Risk-based controls
      risk_mapping_and_measurement:
        text: risk_mapping_and_measurement
        title: Risk mapping and measurement
      science_backed_tevv_practices:
        text: science_backed_tevv_practices
        title: Science-backed TEVV practices
      secure_software_development_practices:
        text: secure_software_development_practices
        title: Secure software development practices
      stakeholder_engagement:
        text: stakeholder_engagement
        title: Stakeholder engagement
      synthetic_content_detection_and_labeling_tools_and_techniques:
        text: synthetic_content_detection_and_labeling_tools_and_techniques
        title: Synthetic content detection and labeling tools and techniques
      whistleblower_protections:
        text: whistleblower_protections
        title: Whistleblower protections
      workforce_diversity_and_interdisciplinary_teams:
        text: workforce_diversity_and_interdisciplinary_teams
        title: Workforce diversity and interdisciplinary teams
  GaiThirdPartyControl:
    name: GaiThirdPartyControl
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiThirdPartyControl
    description: The existing controls that section A.1.3 says can apply to third-party
      GAI.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    permissible_values:
      acquisition_and_procurement_due_diligence:
        text: acquisition_and_procurement_due_diligence
        description: Checking a provider before acquiring its GAI technology or data.
        title: Acquisition and procurement due diligence
      software_bills_of_materials:
        text: software_bills_of_materials
        description: Asking a provider what its software is made of.
        title: Requests for software bills of materials
        related_mappings:
        - spdx_software:Sbom
      service_level_agreements:
        text: service_level_agreements
        description: Holding a provider to agreed levels of service.
        title: Application of service level agreements
      ssae_reports:
        text: ssae_reports
        description: Asking for a provider's attestation reports.
        title: Statement on standards for attestation engagement reports
  GaiRedTeamingType:
    name: GaiRedTeamingType
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiRedTeamingType
    description: The types of AI red-teaming in section A.1.5.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    permissible_values:
      general_public:
        text: general_public
        description: By general users who are not necessarily AI or technical experts.
        title: General Public
      expert:
        text: expert
        description: By specialists in the domain or the context of use.
        title: Expert
      combination:
        text: combination
        description: By both experts and general public participants.
        title: Combination
      human_ai:
        text: human_ai
        description: By GAI together with human teams, specialist or not.
        title: Human / AI
  GaiProvenanceTechnique:
    name: GaiProvenanceTechnique
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiProvenanceTechnique
    description: The techniques for provenance data tracking in section A.1.6.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    permissible_values:
      digital_watermarking:
        text: digital_watermarking
        description: Placing visible or hidden marks on content.
        title: Digital watermarking
      metadata_recording:
        text: metadata_recording
        description: Recording facts about the content, such as its creator, date
          and sources.
        title: Metadata recording
      digital_fingerprinting:
        text: digital_fingerprinting
        description: Identifying content from its own characteristics.
        title: Digital fingerprinting
      human_authentication:
        text: human_authentication
        description: Having people confirm where content came from.
        title: Human authentication
  GaiIncidentHarm:
    name: GaiIncidentHarm
    definition_uri: https://w3id.org/lmodel/nist-ai-600-1/GaiIncidentHarm
    description: The kinds of harm that section A.1.8's definition of an AI incident
      names.
    from_schema: https://w3id.org/lmodel/nist-ai-600-1/nist_ai_600_1_considerations
    permissible_values:
      injury_or_harm_to_health:
        text: injury_or_harm_to_health
        description: To a person or group, including psychological harm and harm to
          mental health.
        title: Injury or harm to health
      critical_infrastructure_disruption:
        text: critical_infrastructure_disruption
        description: To its management and operation.
        title: Disruption of critical infrastructure
      rights_violations:
        text: rights_violations
        description: Of human rights, or of obligations under law that protects fundamental,
          labor and intellectual property rights.
        title: Violations of rights or legal obligations
      harm_to_property_communities_or_environment:
        text: harm_to_property_communities_or_environment
        description: To things and groups beyond the individual.
        title: Harm to property, communities, or the environment
