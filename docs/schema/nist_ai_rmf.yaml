    - aiRmfSystem__ai_rmf_system_deployment_settings
    - aiRmfSystem__ai_rmf_system_lifecycle_stages
    - aiRmfSystem__ai_rmf_system_actors
    attributes:
      ai_rmf_system_intended_purposes:
        name: ai_rmf_system_intended_purposes
        description: What the system is for, and its potentially beneficial uses,
          which MAP 1.1 asks an adopter to document.
        multivalued: true
      ai_rmf_system_deployment_settings:
        name: ai_rmf_system_deployment_settings
        description: The settings the system is or will be deployed in, which MAP
          1.1 asks an adopter to document.
        multivalued: true
      ai_rmf_system_lifecycle_stages:
        name: ai_rmf_system_lifecycle_stages
        description: The lifecycle stages the record covers.
        range: AiRmfLifecycleStageName
        multivalued: true
      ai_rmf_system_actors:
        name: ai_rmf_system_actors
        description: The AI actors with a role in the system's lifecycle, such as
          those MAP 1.6 says elicit its requirements.
        range: AiRmfActor
        multivalued: true
    class_uri: nist_ai_100_1:AiSystem
  AiRmfActor:
    name: AiRmfActor
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfActor
    description: An organization or individual with an active role in an AI system's
      lifecycle.
    from_schema: https://w3id.org/lmodel/nist-ai-100-1/nist_ai_100_1_foundations
    exact_mappings:
    - nist_ai_100_1:AiActor
    broad_mappings:
