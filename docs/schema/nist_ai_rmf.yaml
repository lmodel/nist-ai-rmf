    class_uri: nist_ai_100_1:MeasurementChallenge
  AiRmfSpecificRisk:
    name: AiRmfSpecificRisk
    definition_uri: https://w3id.org/lmodel/nist-ai-100-1/AiRmfSpecificRisk
    description: A risk that Appendix B says is new or increased for AI compared with
