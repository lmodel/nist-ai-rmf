{
  "name": "nist_ai_rmf",
  "description": "One LinkML schema for two NIST publications: the AI Risk Management Framework 1.0 (NIST AI 100-1) and its Generative AI Profile (NIST AI 600-1).",
  "title": "NIST AI Risk Management Framework family",
  "comments": [
    "The version is the 1.0.0 both publications carry, and source is NIST's page for the framework. The release tags are the schema's own versions.",
    "Every module of lmodel/nist-ai-100-1 and lmodel/nist-ai-600-1 is vendored in this folder as released, so the schema needs no network, and tests/test_upstream.py holds them to their hashes. Each element keeps the IRI of its publication, and this schema adds only the class below.",
    "The AI RMF to ISO/IEC 42001 crosswalk pairs records, not schema elements, so it is no mapping of this schema. scripts/build_crosswalk.py writes it as SSSOM under tmp/, and the repository carries neither it nor its PDF, which states no licence."
  ],
  "source": "https://www.nist.gov/itl/ai-risk-management-framework",
  "see_also": [
    "https://lmodel.github.io/nist-ai-rmf",
    "https://w3id.org/lmodel/nist-ai-100-1",
    "https://w3id.org/lmodel/nist-ai-600-1"
  ],
  "id": "https://w3id.org/lmodel/nist-ai-rmf",
  "version": "1.0.0",
  "license": "Apache-2.0",
  "prefixes": {
    "linkml": {
      "prefix_prefix": "linkml",
      "prefix_reference": "https://w3id.org/linkml/"
    },
    "nist_ai_rmf": {
      "prefix_prefix": "nist_ai_rmf",
      "prefix_reference": "https://w3id.org/lmodel/nist-ai-rmf/"
    },
    "xsd": {
      "prefix_prefix": "xsd",
      "prefix_reference": "http://www.w3.org/2001/XMLSchema#"
    },
    "shex": {
      "prefix_prefix": "shex",
      "prefix_reference": "http://www.w3.org/ns/shex#"
    },
    "schema": {
      "prefix_prefix": "schema",
      "prefix_reference": "http://schema.org/"
    },
    "nist_ai_100_1": {
      "prefix_prefix": "nist_ai_100_1",
      "prefix_reference": "https://w3id.org/lmodel/nist-ai-100-1/"
    },
    "iso27001": {
      "prefix_prefix": "iso27001",
      "prefix_reference": "https://w3id.org/lmodel/iso27001/"
    },
    "prov": {
      "prefix_prefix": "prov",
      "prefix_reference": "http://www.w3.org/ns/prov#"
    },
    "nist_csf_v2": {
      "prefix_prefix": "nist_csf_v2",
      "prefix_reference": "https://w3id.org/lmodel/nist-csf-v2/"
    },
    "oscal": {
      "prefix_prefix": "oscal",
      "prefix_reference": "https://w3id.org/lmodel/oscal/"
    },
    "nist_ai_600_1": {
      "prefix_prefix": "nist_ai_600_1",
      "prefix_reference": "https://w3id.org/lmodel/nist-ai-600-1/"
    },
    "stix": {
      "prefix_prefix": "stix",
      "prefix_reference": "https://w3id.org/lmodel/stix/"
    },
    "spdx_software": {
      "prefix_prefix": "spdx_software",
      "prefix_reference": "https://spdx.org/rdf/3.0.1/terms/Software/"
    }
  },
  "default_prefix": "nist_ai_rmf",
  "default_range": "string",
  "types": {
    "string": {
      "name": "string",
      "description": "A character string",
      "notes": [
        "In RDF serializations, a slot with range of string is treated as a literal or type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"string\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "exact_mappings": [
        "schema:Text"
      ],
      "base": "str",
      "uri": "xsd:string"
    },
    "integer": {
      "name": "integer",
      "description": "An integer",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"integer\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "exact_mappings": [
        "schema:Integer"
      ],
      "base": "int",
      "uri": "xsd:integer"
    },
    "boolean": {
      "name": "boolean",
      "description": "A binary (true or false) value",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"boolean\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "exact_mappings": [
        "schema:Boolean"
      ],
      "base": "Bool",
      "uri": "xsd:boolean",
      "repr": "bool"
    },
    "float": {
      "name": "float",
      "description": "A real number that conforms to the xsd:float specification",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"float\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "exact_mappings": [
        "schema:Float"
      ],
      "base": "float",
      "uri": "xsd:float"
    },
    "double": {
      "name": "double",
      "description": "A real number that conforms to the xsd:double specification",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"double\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "close_mappings": [
        "schema:Float"
      ],
      "base": "float",
      "uri": "xsd:double"
    },
    "decimal": {
      "name": "decimal",
      "description": "A real number with arbitrary precision that conforms to the xsd:decimal specification",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"decimal\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "broad_mappings": [
        "schema:Number"
      ],
      "base": "Decimal",
      "uri": "xsd:decimal"
    },
    "time": {
      "name": "time",
      "description": "A time object represents a (local) time of day, independent of any particular day",
      "notes": [
        "URI is dateTime because OWL reasoners do not work with straight date or time",
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"time\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "exact_mappings": [
        "schema:Time"
      ],
      "base": "XSDTime",
      "uri": "xsd:time",
      "repr": "str"
    },
    "date": {
      "name": "date",
      "description": "a date (year, month and day) in an idealized calendar",
      "notes": [
        "URI is dateTime because OWL reasoners don't work with straight date or time",
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"date\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "exact_mappings": [
        "schema:Date"
      ],
      "base": "XSDDate",
      "uri": "xsd:date",
      "repr": "str"
    },
    "datetime": {
      "name": "datetime",
      "description": "The combination of a date and time",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"datetime\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "exact_mappings": [
        "schema:DateTime"
      ],
      "base": "XSDDateTime",
      "uri": "xsd:dateTime",
      "repr": "str"
    },
    "date_or_datetime": {
      "name": "date_or_datetime",
      "description": "Either a date or a datetime",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"date_or_datetime\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "str",
      "uri": "linkml:DateOrDatetime",
      "repr": "str"
    },
    "uriorcurie": {
      "name": "uriorcurie",
      "description": "a URI or a CURIE",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"uriorcurie\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "URIorCURIE",
      "uri": "xsd:anyURI",
      "repr": "str"
    },
    "curie": {
      "name": "curie",
      "conforms_to": "https://www.w3.org/TR/curie/",
      "description": "a compact URI",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"curie\"."
      ],
      "comments": [
        "in RDF serializations this MUST be expanded to a URI",
        "in non-RDF serializations MAY be serialized as the compact representation"
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "Curie",
      "uri": "xsd:string",
      "repr": "str"
    },
    "uri": {
      "name": "uri",
      "conforms_to": "https://www.ietf.org/rfc/rfc3987.txt",
      "description": "a complete URI",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"uri\"."
      ],
      "comments": [
        "in RDF serializations a slot with range of uri is treated as a literal or type xsd:anyURI unless it is an identifier or a reference to an identifier, in which case it is translated directly to a node"
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "close_mappings": [
        "schema:URL"
      ],
      "base": "URI",
      "uri": "xsd:anyURI",
      "repr": "str"
    },
    "ncname": {
      "name": "ncname",
      "description": "Prefix part of CURIE",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"ncname\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "NCName",
      "uri": "xsd:string",
      "repr": "str"
    },
    "objectidentifier": {
      "name": "objectidentifier",
      "description": "A URI or CURIE that represents an object in the model.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"objectidentifier\"."
      ],
      "comments": [
        "Used for inheritance and type checking"
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "ElementIdentifier",
      "uri": "shex:iri",
      "repr": "str"
    },
    "nodeidentifier": {
      "name": "nodeidentifier",
      "description": "A URI, CURIE or BNODE that represents a node in a model.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"nodeidentifier\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "NodeIdentifier",
      "uri": "shex:nonLiteral",
      "repr": "str"
    },
    "jsonpointer": {
      "name": "jsonpointer",
      "conforms_to": "https://datatracker.ietf.org/doc/html/rfc6901",
      "description": "A string encoding a JSON Pointer. The value of the string MUST conform to JSON Point syntax and SHOULD dereference to a valid object within the current instance document when encoded in tree form.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"jsonpointer\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "str",
      "uri": "xsd:string",
      "repr": "str"
    },
    "jsonpath": {
      "name": "jsonpath",
      "conforms_to": "https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html",
      "description": "A string encoding a JSON Path. The value of the string MUST conform to JSON Point syntax and SHOULD dereference to zero or more valid objects within the current instance document when encoded in tree form.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"jsonpath\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "str",
      "uri": "xsd:string",
      "repr": "str"
    },
    "sparqlpath": {
      "name": "sparqlpath",
      "conforms_to": "https://www.w3.org/TR/sparql11-query/#propertypaths",
      "description": "A string encoding a SPARQL Property Path. The value of the string MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects within the current instance document when encoded as RDF.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"sparqlpath\"."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "base": "str",
      "uri": "xsd:string",
      "repr": "str"
    },
    "ai_rmf_function_identifier": {
      "name": "ai_rmf_function_identifier",
      "description": "The name of one of the four Core functions, written in capitals, such as GOVERN.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^(GOVERN|MAP|MEASURE|MANAGE)$"
    },
    "ai_rmf_category_identifier": {
      "name": "ai_rmf_category_identifier",
      "description": "A category's identifier, its function's name and a number, such as GOVERN 1.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])$"
    },
    "ai_rmf_subcategory_identifier": {
      "name": "ai_rmf_subcategory_identifier",
      "description": "A subcategory's identifier, its category's identifier, a dot and a number, such as GOVERN 1.1.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])\\.[1-9][0-9]?$"
    },
    "ai_rmf_suggested_action_identifier": {
      "name": "ai_rmf_suggested_action_identifier",
      "description": "The identifier NIST's catalog gives a Playbook suggested action, such as SA-GOVERN_1.1-1. Each further number, as in SA-GOVERN_1.4-1.2, marks a sub-item.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^SA-(GOVERN|MAP|MEASURE|MANAGE)_[1-6]\\.[1-9][0-9]?-[1-9][0-9]?(\\.[1-9][0-9]?)*$"
    },
    "ai_rmf_documentation_identifier": {
      "name": "ai_rmf_documentation_identifier",
      "description": "The identifier NIST's catalog gives a Playbook documentation prompt, such as D-GOVERN_1.1-1.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^D-(GOVERN|MAP|MEASURE|MANAGE)_[1-6]\\.[1-9][0-9]?-[1-9][0-9]?$"
    },
    "gai_action_identifier": {
      "name": "gai_action_identifier",
      "description": "An Action ID: the function's two letters, its subcategory's numbers and a three-digit number, such as GV-1.1-001 for the first action of GOVERN 1.1.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^(GV-[1-6]|MP-[1-5]|MS-[1-4]|MG-[1-4])\\.[1-9][0-9]?-[0-9]{3}$"
    }
  },
  "enums": {
    "AiRmfCharacteristicName": {
      "name": "AiRmfCharacteristicName",
      "description": "The seven characteristics of trustworthy AI systems in section 3 of the publication.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "permissible_values": {
        "valid_and_reliable": {
          "text": "valid_and_reliable",
          "description": "Shown by evidence to meet the needs of its intended use, and works without failure over time. Figure 4 makes it a necessary condition for the others.",
          "title": "Valid and Reliable"
        },
        "safe": {
          "text": "safe",
          "description": "Keeps people, property and the environment out of danger under defined conditions.",
          "title": "Safe"
        },
        "secure_and_resilient": {
          "text": "secure_and_resilient",
          "description": "Withstands adverse events and recovers from them, and keeps confidentiality, integrity and availability through protections against attack.",
          "title": "Secure and Resilient"
        },
        "accountable_and_transparent": {
          "text": "accountable_and_transparent",
          "description": "Answerable for outcomes, which rests on people being able to get information about the system and its outputs. Figure 4 shows it relating to all the others.",
          "title": "Accountable and Transparent"
        },
        "explainable_and_interpretable": {
          "text": "explainable_and_interpretable",
          "description": "Its working can be represented (how a decision was made) and its output understood in context (why, and what it means for the user).",
          "title": "Explainable and Interpretable"
        },
        "privacy_enhanced": {
          "text": "privacy_enhanced",
          "description": "Guided by the norms and practices that protect human autonomy, identity and dignity, such as anonymity, confidentiality and control.",
          "title": "Privacy-Enhanced"
        },
        "fair_with_harmful_bias_managed": {
          "text": "fair_with_harmful_bias_managed",
          "description": "Addresses equality and equity, including harmful bias and discrimination, knowing that views of fairness differ across cultures and applications.",
          "title": "Fair – with Harmful Bias Managed"
        }
      }
    },
    "AiRmfActorTaskName": {
      "name": "AiRmfActorTaskName",
      "description": "The ten AI actor tasks and five additional AI actors of Appendix A.",
      "comments": [
        "One list holds both kinds because NIST tags them together: the Playbook under its AI Actors key, and AI 600-1 under AI Actor Tasks. Each alias is the spelling those tags use where it differs from the title in Appendix A."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "permissible_values": {
        "ai_design": {
          "text": "ai_design",
          "description": "Setting what the system is for, planning and designing it, and gathering and preparing its data.",
          "title": "AI Design"
        },
        "ai_development": {
          "text": "ai_development",
          "description": "Providing the initial infrastructure, and creating, selecting, calibrating, training and testing models.",
          "title": "AI Development"
        },
        "ai_deployment": {
          "text": "ai_deployment",
          "description": "Deciding how the system is used and putting it into production, including pilots and compliance checks.",
          "title": "AI Deployment"
        },
        "operation_and_monitoring": {
          "text": "operation_and_monitoring",
          "description": "Running the system and regularly assessing its output and impacts.",
          "title": "Operation and Monitoring"
        },
        "tevv": {
          "text": "tevv",
          "description": "Examining the system or its components and finding and fixing problems, throughout the lifecycle.",
          "title": "Test, Evaluation, Verification, and Validation (TEVV)",
          "aliases": [
            "TEVV"
          ]
        },
        "human_factors": {
          "text": "human_factors",
          "description": "Human-centered design and evaluation, involving end users and bringing context-specific norms and values into design.",
          "title": "Human Factors"
        },
        "domain_expert": {
          "text": "domain_expert",
          "description": "Giving knowledge of the sector or setting where the system is used.",
          "title": "Domain Expert",
          "aliases": [
            "Domain Experts"
          ]
        },
        "ai_impact_assessment": {
          "text": "ai_impact_assessment",
          "description": "Assessing accountability, harmful bias, impacts, product safety, liability and security.",
          "title": "AI Impact Assessment"
        },
        "procurement": {
          "text": "procurement",
          "description": "Acquiring AI from another party, under financial, legal or policy authority.",
          "title": "Procurement"
        },
        "governance_and_oversight": {
          "text": "governance_and_oversight",
          "description": "Holding management, fiduciary and legal authority for the organization where the system is designed, developed or deployed.",
          "title": "Governance and Oversight"
        },
        "third_party_entities": {
          "text": "third_party_entities",
          "description": "Outside organizations that supply or evaluate the data, models, systems or services an organization acquires.",
          "title": "Third-party entities"
        },
        "end_users": {
          "text": "end_users",
          "description": "The people or groups who use the system, whether new to technology or expert in AI.",
          "title": "End users",
          "aliases": [
            "End-Users",
            "End Users"
          ]
        },
        "affected_individuals_and_communities": {
          "text": "affected_individuals_and_communities",
          "description": "Those directly or indirectly affected by the system or its output, whether or not they interact with it.",
          "title": "Affected individuals/communities",
          "aliases": [
            "Affected Individuals and Communities"
          ]
        },
        "other_ai_actors": {
          "text": "other_ai_actors",
          "description": "Those who may provide norms or guidance on AI risk, such as standards bodies, advocacy groups and researchers.",
          "title": "Other AI actors"
        },
        "general_public": {
          "text": "general_public",
          "description": "Those most likely to experience the impacts directly, who may motivate what other AI actors do.",
          "title": "General public"
        }
      }
    },
    "AiRmfDimensionName": {
      "name": "AiRmfDimensionName",
      "description": "The key dimensions of an AI system in Figure 2.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "permissible_values": {
        "application_context": {
          "text": "application_context",
          "description": "The setting the system is planned for and operated in.",
          "title": "Application Context"
        },
        "data_and_input": {
          "text": "data_and_input",
          "description": "The data the system is built from and takes in.",
          "title": "Data and Input"
        },
        "ai_model": {
          "text": "ai_model",
          "description": "The models built, used, verified and validated.",
          "title": "AI Model"
        },
        "task_and_output": {
          "text": "task_and_output",
          "description": "What the system does and produces once deployed.",
          "title": "Task and Output"
        },
        "people_and_planet": {
          "text": "people_and_planet",
          "description": "Human rights and the well-being of society and the planet, at the center of Figure 2.",
          "title": "People and Planet"
        }
      }
    },
    "AiRmfLifecycleStageName": {
      "name": "AiRmfLifecycleStageName",
      "description": "The AI lifecycle stages in Figure 3, of which Figure 2 shows the first six.",
      "from_schema": "https://w3id.org/lmodel/nist-ai-rmf",
      "permissible_values": {
        "plan_and_design": {
          "text": "plan_and_design",
          "description": "Documenting the concept, objectives, assumptions, context and requirements.",
          "title": "Plan and Design"
        },
        "collect_and_process_data": {
          "text": "collect_and_process_data",
          "description": "Gathering, validating and cleaning data, and recording what it holds.",
          "title": "Collect and Process Data"
        },
        "build_and_use_model": {
          "text": "build_and_use_model",
          "description": "Creating or selecting algorithms and training models.",
          "title": "Build and Use Model"
        },
        "verify_and_validate": {
          "text": "verify_and_validate",
          "description": "Verifying, validating, calibrating and interpreting model output.",
          "title": "Verify and Validate"
        },
        "deploy_and_use": {
          "text": "deploy_and_use",
          "description": "Piloting, checking compatibility and compliance, managing change and evaluating user experience.",
          "title": "Deploy and Use"
        },
        "operate_and_monitor": {
          "text": "operate_and_monitor",
          "description": "Operating the system and continually assessing its recommendations and impacts.",
          "title": "Operate and Monitor"
        },
        "use_or_impacted_by": {
