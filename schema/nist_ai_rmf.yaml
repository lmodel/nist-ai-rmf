    from_schema: https://w3id.org/lmodel/nist-ai-rmf-gai
    is_a: feedback_method_kind
    domain: AiRedTeaming
    slot_uri: nist_ai_rmf_gai:feedback_method_kind
    ifabsent: StructuredFeedbackMethodEnum(AI_RED_TEAMING)
    alias: feedback_method_kind
    owner: AiRedTeaming
    domain_of:
    - AiRedTeaming
    is_usage_slot: true
    usage_slot_name: feedback_method_kind
    range: StructuredFeedbackMethodEnum
    required: true
  GaiProfile_profile_type:
    name: GaiProfile_profile_type
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/profile_type
    description: The kind of AI RMF Profile.
    in_subset:
    - profiles
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    is_a: profile_type
    domain: GaiProfile
    slot_uri: nist_ai_rmf:profile_type
    ifabsent: ProfileTypeEnum(CROSS_SECTORAL)
    alias: profile_type
    owner: GaiProfile
    domain_of:
    - GaiProfile
    is_usage_slot: true
    usage_slot_name: profile_type
    range: ProfileTypeEnum
    required: true
classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/NamedThing
    description: A generic grouping for any identifiable AI RMF element.
    in_subset:
    - core
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - schema:Thing
    close_mappings:
    - schema:Thing
    abstract: true
    slots:
    - id
    - name
    - title
    - description
    - see_also
    class_uri: schema:Thing
  AiSystem:
    name: AiSystem
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/AiSystem
    description: 'An engineered or machine-based system that can, for a given set

      of objectives, generate outputs such as predictions,

      recommendations, or decisions influencing real or virtual

      environments. AI systems are designed to operate with varying

      levels of autonomy (Adapted from OECD Recommendation on AI:2019;

      ISO/IEC 22989:2022).'
    in_subset:
    - lifecycle
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:AiSystem
    close_mappings:
    - schema:SoftwareApplication
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - lifecycle_stage
    - ai_dimension
    class_uri: nist_ai_rmf:AiSystem
  AiSystemDimension:
    name: AiSystemDimension
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/AiSystemDimension
    description: 'A socio-technical dimension of an AI system (Figure 2):

      Application Context, Data and Input, AI Model, Task and Output,

      or People and Planet.'
    in_subset:
    - lifecycle
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:AiSystemDimension
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - aiSystemDimension__dimension_kind
    attributes:
      dimension_kind:
        name: dimension_kind
        description: Which of the five dimensions this instance represents.
        range: AiSystemDimensionEnum
        required: true
    class_uri: nist_ai_rmf:AiSystemDimension
  AiLifecycleStage:
    name: AiLifecycleStage
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/AiLifecycleStage
    description: 'A stage of the AI lifecycle (Figure 2): Plan and Design,

      Collect and Process Data, Build and Use Model, Verify and

      Validate, Deploy and Use, or Operate and Monitor.'
    in_subset:
    - lifecycle
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:AiLifecycleStage
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - aiLifecycleStage__stage_kind
    - aiLifecycleStage__includes_tevv
    attributes:
      stage_kind:
        name: stage_kind
        description: Which of the six stages this instance represents.
        range: AiLifecycleStageEnum
        required: true
      includes_tevv:
        name: includes_tevv
        description: Whether this stage incorporates TEVV activities.
        range: boolean
    class_uri: nist_ai_rmf:AiLifecycleStage
  AiActor:
    name: AiActor
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/AiActor
    description: 'An organization or individual that plays an active role in the AI

      system lifecycle. AI actors include those who deploy or operate

      AI as well as those who inform via formal or quasi-formal norms

      and guidance (OECD 2019).'
    in_subset:
    - lifecycle
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:AiActor
    close_mappings:
    - prov:Agent
    - foaf:Agent
    related_mappings:
    - stix:Identity
    - iso27001:InterestedParty
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - actor_task
    - lifecycle_stage
    - is_tevv
    - audience
    class_uri: nist_ai_rmf:AiActor
  AiActorTask:
    name: AiActorTask
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/AiActorTask
    description: 'A category of task performed by AI actors (Appendix A). Each

      task is associated with one or more lifecycle stages and a

      typical set of actor roles.'
    in_subset:
    - lifecycle
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:AiActorTask
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - lifecycle_stage
    - ai_dimension
    - aiActorTask__task_kind
    - aiActorTask__typical_actors
    attributes:
      task_kind:
        name: task_kind
        description: Which of the actor task categories this is.
        range: AiActorTaskEnum
        required: true
      typical_actors:
        name: typical_actors
        description: Representative actor roles that perform this task.
        range: string
        multivalued: true
    class_uri: nist_ai_rmf:AiActorTask
  Risk:
    name: Risk
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/Risk
    description: 'The composite measure of an event''s probability of occurring and

      the magnitude or degree of the consequences of that event. When

      considering negative impact, risk is a function of (1) the

      negative impact or magnitude of harm and (2) the likelihood of

      occurrence (Adapted from ISO 31000:2018; OMB Circular A-130:2016).'
    in_subset:
    - risk_and_harm
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:Risk
    - iso27001:Risk
    related_mappings:
    - iso29100:PrivacyRisk
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - likelihood
    - magnitude
    - impact_sign
    - is_residual
    - risk_response
    - lifecycle_stage
    - trustworthiness_characteristic
    - risk__related_impacts
    - risk__affects_system
    attributes:
      related_impacts:
        name: related_impacts
        description: The impacts that contribute to this risk.
        range: Impact
        multivalued: true
        inlined: true
        inlined_as_list: true
      affects_system:
        name: affects_system
        description: The AI system this risk pertains to.
        range: AiSystem
    class_uri: nist_ai_rmf:Risk
  Impact:
    name: Impact
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/Impact
    description: 'A positive, negative, or both consequence of an AI system. Impacts

      can manifest as opportunities (positive) or threats (negative).'
    in_subset:
    - risk_and_harm
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:Impact
    narrow_mappings:
    - iso27001:ImpactRating
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - impact_sign
    - magnitude
    - likelihood
    - affects
    class_uri: nist_ai_rmf:Impact
  Harm:
    name: Harm
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/Harm
    description: 'A negative impact that may be experienced by individuals,

      groups, communities, organizations, society, the environment, or

      the planet (Figure 1).'
    in_subset:
    - risk_and_harm
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:Harm
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - harm_category
    - harm_to_people_subcategory
    - magnitude
    - affects
    class_uri: nist_ai_rmf:Harm
  ResidualRisk:
    name: ResidualRisk
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/ResidualRisk
    description: 'Risk remaining after risk treatment (ISO Guide 73). Documenting

      residual risks helps system providers consider risks of deploying

      the AI product and informs end users about potential negative

      impacts.'
    in_subset:
    - risk_and_harm
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:ResidualRisk
    narrow_mappings:
    - iso27001:Risk
    is_a: Risk
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - likelihood
    - magnitude
    - impact_sign
    - risk_response
    - lifecycle_stage
    - trustworthiness_characteristic
    - risk__related_impacts
    - risk__affects_system
    - ResidualRisk_is_residual
    slot_usage:
      is_residual:
        name: is_residual
        ifabsent: 'True'
    class_uri: nist_ai_rmf:ResidualRisk
  RiskTolerance:
    name: RiskTolerance
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/RiskTolerance
    description: 'The organization''s or AI actor''s readiness to bear risk in order

      to achieve its objectives (Adapted from ISO Guide 73). Risk

      tolerance is highly contextual and application- and use-case

      specific.'
    in_subset:
    - risk_and_harm
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:RiskTolerance
    close_mappings:
    - iso27001:RiskLevel
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - riskTolerance__tolerance_statement
    - riskTolerance__legal_basis
    attributes:
      tolerance_statement:
        name: tolerance_statement
        description: Free-text statement of the tolerance level or threshold.
        range: string
      legal_basis:
        name: legal_basis
        description: Legal or regulatory requirements influencing the tolerance.
        range: string
    class_uri: nist_ai_rmf:RiskTolerance
  RiskMeasurementChallenge:
    name: RiskMeasurementChallenge
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/RiskMeasurementChallenge
    description: "A challenge that complicates measurement of AI risks\n(Part 1 \xA7\
      1.2.1)."
    in_subset:
    - risk_and_harm
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:RiskMeasurementChallenge
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - riskMeasurementChallenge__challenge_kind
    attributes:
      challenge_kind:
        name: challenge_kind
        description: Which measurement challenge this represents.
        range: RiskMeasurementChallengeEnum
        required: true
    class_uri: nist_ai_rmf:RiskMeasurementChallenge
  TrustworthinessCharacteristic:
    name: TrustworthinessCharacteristic
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/TrustworthinessCharacteristic
    description: "A characteristic of a trustworthy AI system (Figure 4 / Part 1\n\
      \xA73). The seven characteristics are inter-related; addressing them\nindividually\
      \ does not guarantee trustworthiness, and tradeoffs\nare usually involved."
    in_subset:
    - trustworthiness
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:TrustworthinessCharacteristic
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - trustworthinessCharacteristic__characteristic_kind
    - trustworthinessCharacteristic__is_base_condition
    - trustworthinessCharacteristic__is_cross_cutting
    attributes:
      characteristic_kind:
        name: characteristic_kind
        description: Which trustworthiness characteristic this instance represents.
        range: TrustworthinessCharacteristicEnum
        required: true
      is_base_condition:
        name: is_base_condition
        description: 'True when this is a necessary condition for trustworthiness

          (Valid and Reliable; per Figure 4 it is the base of all other

          characteristics).'
        range: boolean
      is_cross_cutting:
        name: is_cross_cutting
        description: 'True when this characteristic relates to all others

          (Accountable and Transparent; shown vertically in Figure 4).'
        range: boolean
    class_uri: nist_ai_rmf:TrustworthinessCharacteristic
  Bias:
    name: Bias
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/Bias
    description: "A form of AI bias - a deviation that may be perpetuated or\namplified\
      \ by AI systems. NIST identifies three major categories:\nsystemic, computational/statistical,\
      \ and human-cognitive\n(Part 1 \xA73.7; NIST SP 1270)."
    in_subset:
    - trustworthiness
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:Bias
    related_mappings:
    - iso29100:PrivacyPrinciple
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - bias_category
    class_uri: nist_ai_rmf:Bias
  Function:
    name: Function
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/Function
    description: 'A top-level AI RMF Core function. Each function organizes AI risk

      management activities at the highest level. GOVERN applies across

      all stages; MAP, MEASURE, and MANAGE apply to AI-system-specific

      contexts and lifecycle stages.'
    in_subset:
    - framework_core
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:Function
    - nist_csf:CSFFunction
    related_mappings:
    - gist:Function
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - function_code
    - Function_categories
    slot_usage:
      categories:
        name: categories
        range: Category
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_ai_rmf:Function
  Category:
    name: Category
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/Category
    description: 'A category within an AI RMF Core function (e.g., "GOVERN 1:

      Policies, processes, procedures, and practices ... are in place,

      transparent, and implemented effectively"). Categories group

      related subcategories.'
    in_subset:
    - framework_core
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:Category
    - nist_csf:CSFCategory
    is_a: NamedThing
    slots:
    - name
    - title
    - description
    - see_also
    - category_id
    - outcome
    - Category_subcategories
    - Category_id
    slot_usage:
      id:
        name: id
        description: 'Identifier for the category, typically using the

          "FUNCTION N" form (e.g., "GOVERN 1").'
      subcategories:
        name: subcategories
        range: Subcategory
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_ai_rmf:Category
  Subcategory:
    name: Subcategory
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/Subcategory
    description: 'A subcategory within an AI RMF Core category (e.g., "GOVERN 1.1:

      Legal and regulatory requirements involving AI are understood,

      managed, and documented"). Subcategories express specific

      outcomes.'
    in_subset:
    - framework_core
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:Subcategory
    - nist_csf:CSFSubcategory
    close_mappings:
    - oscal_catalog:Control
    - nist_sp_800_53:Control
    is_a: NamedThing
    slots:
    - name
    - title
    - description
    - see_also
    - subcategory_id
    - outcome
    - trustworthiness_characteristic
    - lifecycle_stage
    - about_text
    - suggested_actions_text
    - documentation_questions
    - references_text
    - topics
    - ai_actor_categories
    - Subcategory_id
    slot_usage:
      id:
        name: id
        description: 'Identifier for the subcategory in the "FUNCTION N.M" form

          (e.g., "GOVERN 1.1").'
    class_uri: nist_ai_rmf:Subcategory
  AiRmfProfile:
    name: AiRmfProfile
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/AiRmfProfile
    description: "An implementation of the AI RMF Functions, Categories, and\nSubcategories\
      \ for a specific setting or application based on the\nrequirements, risk tolerance,\
      \ and resources of the user (\xA76).\nProfiles may be use-case-specific, temporal\
      \ (current or target),\nor cross-sectoral."
    in_subset:
    - profiles
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:AiRmfProfile
    - oscal_profile:Profile
    close_mappings:
    - nist_sp_800_53:ProfileDocument
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - profile_type
    - current_state
    - target_state
    - aiRmfProfile__sector
    - aiRmfProfile__addresses
    attributes:
      sector:
        name: sector
        description: 'The sector, industry, technology, or end-use application the

          profile addresses (e.g., "hiring", "fair housing").'
        range: string
      addresses:
        name: addresses
        description: Subcategories that the profile implements or addresses.
        range: Subcategory
        multivalued: true
    class_uri: nist_ai_rmf:AiRmfProfile
  RmfAttribute:
    name: RmfAttribute
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/RmfAttribute
    description: 'A design attribute of the AI RMF (Appendix D) - one of the

      qualities the Framework strives to embody (e.g., risk-based,

      consensus-driven, plain language, common language, easily usable,

      universally applicable, outcome-focused, leveraging existing

      standards, law- and regulation-agnostic, living document).'
    in_subset:
    - attributes
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:RmfAttribute
    related_mappings:
    - nist_csf:CSFProperty
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    class_uri: nist_ai_rmf:RmfAttribute
  AiSpecificRisk:
    name: AiSpecificRisk
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/AiSpecificRisk
    description: 'A risk that is new or increased for AI-based technology compared

      to traditional software (Appendix B) - e.g., data quality, model

      drift, opacity, scale and complexity, pre-trained model

      uncertainty, emergent properties, privacy aggregation, or

      environmental cost.'
    in_subset:
    - appendices
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:AiSpecificRisk
    broad_mappings:
    - iso27001:Risk
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    class_uri: nist_ai_rmf:AiSpecificRisk
  HumanAiInteractionIssue:
    name: HumanAiInteractionIssue
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/HumanAiInteractionIssue
    description: 'An issue that merits further consideration in human-AI

      interaction (Appendix C) - e.g., clear human roles and

      responsibilities, systemic and human-cognitive biases in design,

      variability of human-AI interaction outcomes, complexity of

      presenting AI system information to humans.'
    in_subset:
    - appendices
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:HumanAiInteractionIssue
    related_mappings:
    - iso27001:InterestedParty
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    class_uri: nist_ai_rmf:HumanAiInteractionIssue
  PlaybookEntry:
    name: PlaybookEntry
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/PlaybookEntry
    description: 'A single AI RMF Playbook entry - an enrichment of a Core

      subcategory with prose discussion, suggested actions,

      documentation questions, references, and topic tags.


      Attribute names use the same identifiers found in the published

      NIST AI RMF Playbook JSON (e.g., `section_about`,

      `section_actions`) so that the data can be loaded directly.'
    in_subset:
    - playbook
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:PlaybookEntry
    close_mappings:
    - nist_csf:CSFSubcategory
    slots:
    - playbookEntry__type
    - playbookEntry__title
    - playbookEntry__category
    - playbookEntry__description
    - playbookEntry__section_about
    - playbookEntry__section_actions
    - playbookEntry__section_doc
    - playbookEntry__section_ref
    - playbookEntry__ai_actors
    - playbookEntry__topic
    attributes:
      type:
        name: type
        description: 'Function label as serialised in the published Playbook JSON

          (Title case - "Govern", "Map", "Measure", "Manage"). For

          the controlled enum see `function_kind`.'
        range: string
      title:
        name: title
        description: 'Subcategory identifier (e.g., "GOVERN 1.1"). Mirrors the

          AI RMF Subcategory `subcategory_id`.'
        range: string
      category:
        name: category
        description: 'Category code in the form "FUNCTION-N" (e.g., "GOVERN-1")

          as used in the Playbook.'
        range: string
      description:
        name: description
        description: Outcome statement of the subcategory.
        range: string
      section_about:
        name: section_about
        description: Free-text discussion ("About" section).
        range: string
      section_actions:
        name: section_actions
        description: Bulleted suggested actions ("Actions" section).
        range: string
      section_doc:
        name: section_doc
        description: 'Documentation questions and transparency resources

          ("Documentation" section).'
        range: string
      section_ref:
        name: section_ref
        description: References and citations ("References" section).
        range: string
      ai_actors:
        name: ai_actors
        description: 'AI actor categories the entry applies to. Free-text to

          preserve the casing of the source data (e.g., "Governance

          and Oversight").'
        range: string
        multivalued: true
      topic:
        name: topic
        description: 'Topic tags (e.g., "Legal and Regulatory", "Validity and

          Reliability").'
        range: string
        multivalued: true
    class_uri: nist_ai_rmf:PlaybookEntry
  PlaybookCollection:
    name: PlaybookCollection
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf/PlaybookCollection
    description: 'A container for a set of PlaybookEntry instances - the

      serialisation root for an AI RMF Playbook companion document.

      Validate with ``linkml-validate --target-class PlaybookCollection``;

      the canonical tree-root for the schema is ``AiRmfFramework``.'
    in_subset:
    - playbook
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-core
    exact_mappings:
    - nist_ai_rmf:PlaybookCollection
    slots:
