  PrimaryGaiConsideration:
    name: PrimaryGaiConsideration
    definition_uri: https://w3id.org/lmodel/nist-ai-rmf-gai/PrimaryGaiConsideration
    description: "An overarching consideration derived from the NIST GAI PWG\nconsultation\
      \ process (Appendix A). The `consideration_kind`\nattribute discriminates between\
      \ the four primary\nconsiderations: Governance, Pre-Deployment Testing, Content\n\
      Provenance, and Incident Disclosure.\n\nAll consideration-specific attributes\
      \ are optional and apply\nto the appropriate `consideration_kind`:\n  * GOVERNANCE:\
      \ governance_practices, third_party_considerations\n  * PRE_DEPLOYMENT_TESTING:\
      \ limitations_of_current_approaches\n  * CONTENT_PROVENANCE: provenance_techniques\n\
      \  * INCIDENT_DISCLOSURE: ai_incident_definition"
    in_subset:
    - gai_considerations
    from_schema: https://w3id.org/lmodel/nist-ai-rmf-gai
    exact_mappings:
    - nist_ai_rmf_gai:PrimaryGaiConsideration
    related_mappings:
    - nist_csf:CSFProperty
    is_a: NamedThing
    slots:
    - id
    - name
    - title
    - description
    - see_also
    - consideration_kind
    - primaryGaiConsideration__governance_practices
    - primaryGaiConsideration__third_party_considerations
    - primaryGaiConsideration__limitations_of_current_approaches
    - primaryGaiConsideration__provenance_techniques
    - primaryGaiConsideration__ai_incident_definition
    attributes:
      governance_practices:
        name: governance_practices
        description: 'Governance plans and actions (A.1.2) - e.g., "Auditing and

          assessment", "Data provenance", "Incident response",

          "Impact assessments", "Stakeholder engagement", "Synthetic

          content detection", "Whistleblower protections".'
        range: string
        multivalued: true
      third_party_considerations:
        name: third_party_considerations
        description: 'Considerations for third-party GAI integrations,

          procurement, SBOMs, SLAs, and SSAE reports (A.1.3).'
        range: string
      limitations_of_current_approaches:
        name: limitations_of_current_approaches
        description: 'For Pre-Deployment Testing: free-text discussion of why

          current TEVV approaches may be inadequate (A.1.4).'
        range: string
      provenance_techniques:
        name: provenance_techniques
        description: 'For Content Provenance: provenance data tracking

          techniques such as digital watermarking, metadata

          recording, digital fingerprinting, human authentication

          (A.1.6).'
        range: string
        multivalued: true
      ai_incident_definition:
        name: ai_incident_definition
        description: 'For Incident Disclosure: the definition of AI incident

          used by the organisation (A.1.8).'
        range: string
    class_uri: nist_ai_rmf_gai:PrimaryGaiConsideration
