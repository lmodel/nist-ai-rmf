- ai_rmf_subcategory_id: MEASURE 2.12
  description: Environmental impact and sustainability of AI model training and management activities
    – as identified in the MAP function – are assessed and documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.12-001
    description: Assess safety to physical environments when deploying GAI systems.
    gai_action_risks:
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.12-002
    description: Document anticipated environmental impacts of model development, maintenance, and deployment
      in product design decisions.
    gai_action_risks:
    - environmental_impacts
  - gai_action_id: MS-2.12-003
    description: 'Measure or estimate environmental impacts (e.g., energy and water consumption) for training,
      fine tuning, and deploying models: Verify tradeoffs between resources used at inference time versus
      additional resources required at training time.'
    gai_action_risks:
    - environmental_impacts
  - gai_action_id: MS-2.12-004
    description: Verify effectiveness of carbon capture or offset programs for GAI training and applications,
      and address green-washing concerns.
    gai_action_risks:
    - environmental_impacts
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_impact_assessment
