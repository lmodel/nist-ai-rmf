- ai_rmf_subcategory_id: MEASURE 2.10
  description: Privacy risk of the AI system – as identified in the MAP function – is examined and documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.10-001
    description: 'Conduct AI red-teaming to assess issues such as: Outputting of training data samples,
      and subsequent reverse engineering, model extraction, and membership inference risks; Revealing
      biometric, confidential, copyrighted, licensed, patented, personal, proprietary, sensitive, or trade-marked
      information; Tracking or revealing location information of users or members of training datasets.'
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
    - intellectual_property
  - gai_action_id: MS-2.10-002
    description: Engage directly with end-users and other stakeholders to understand their expectations
      and concerns regarding content provenance. Use this feedback to guide the design of provenance data-tracking
      techniques.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
  - gai_action_id: MS-2.10-003
    description: Verify deduplication of GAI training data samples, particularly regarding synthetic data.
    gai_action_risks:
    - harmful_bias_or_homogenization
