- ai_rmf_subcategory_id: MEASURE 2.11
  description: Fairness and bias – as identified in the MAP function – are evaluated and results are documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.11-001
    description: Apply use-case appropriate benchmarks (e.g., Bias Benchmark Questions, Real Hateful or
      Harmful Prompts, Winogender Schemas) to quantify systemic bias, stereotyping, denigration, and hateful
      content in GAI system outputs; Document assumptions and limitations of benchmarks, including any
      actual or possible training/test data cross contamination, relative to in-context deployment environment.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MS-2.11-002
    description: 'Conduct fairness assessments to measure systemic bias. Measure GAI system performance
      across demographic groups and subgroups, addressing both quality of service and any allocation of
      services and resources. Quantify harms using: field testing with sub-group populations to determine
      likelihood of exposure to generated content exhibiting harmful bias, AI red-teaming with counterfactual
      and low-context (e.g., “leader,” “bad guys”) prompts. For ML pipelines or business processes with
      categorical or numeric outcomes that rely on GAI, apply general fairness metrics (e.g., demographic
      parity, equalized odds, equal opportunity, statistical hypothesis tests), to the pipeline or business
      outcome where appropriate; Custom, context-specific metrics developed in collaboration with domain
      experts and affected communities; Measurements of the prevalence of denigration in generated content
      in deployment (e.g., sub-sampling a fraction of traffic and manually annotating denigrating content).'
    gai_action_risks:
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.11-003
    description: Identify the classes of individuals, groups, or environmental ecosystems which might
      be impacted by GAI systems through direct engagement with potentially impacted communities.
    gai_action_risks:
    - environmental_impacts
    - harmful_bias_or_homogenization
  - gai_action_id: MS-2.11-004
    description: 'Review, document, and measure sources of bias in GAI training and TEVV data: Differences
      in distributions of outcomes across and within groups, including intersecting groups; Completeness,
      representativeness, and balance of data sources; demographic group and subgroup coverage in GAI
      system training data; Forms of latent systemic bias in images, text, audio, embeddings, or other
      complex or unstructured data; Input data features that may serve as proxies for demographic group
      membership (i.e., image metadata, language dialect) or otherwise give rise to emergent bias within
      GAI systems; The extent to which the digital divide may negatively impact representativeness in
      GAI system training and TEVV data; Filtering of hate speech or content in GAI system training data;
      Prevalence of GAI-generated data in GAI system training data.'
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MS-2.11-005
    description: Assess the proportion of synthetic to non-synthetic training data and verify training
      data is not overly homogenous or GAI-produced to mitigate concerns of model collapse.
    gai_action_risks:
    - harmful_bias_or_homogenization
  gai_subcategory_actor_tasks:
