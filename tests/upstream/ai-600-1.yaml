- ai_rmf_subcategory_id: MANAGE 1.3
  description: Responses to the AI risks deemed high priority, as identified by the MAP function, are
    developed, planned, and documented. Risk response options can include mitigating, transferring, avoiding,
    or accepting.
  gai_subcategory_actions:
  - gai_action_id: MG-1.3-001
    description: 'Document trade-offs, decision processes, and relevant measurement and feedback results
      for risks that do not surpass organizational risk tolerance, for example, in the context of model
      release: Consider different approaches for model release, for example, leveraging a staged release
      approach. Consider release approaches in the context of the model and its projected use cases. Mitigate,
      transfer, or avoid risks that surpass organizational risk tolerances.'
    gai_action_risks:
    - information_security
  - gai_action_id: MG-1.3-002
    description: Monitor the robustness and effectiveness of risk controls and mitigation plans (e.g.,
      via red-teaming, field testing, participatory engagements, performance assessments, user feedback
      mechanisms).
    gai_action_risks:
    - human_ai_configuration
  gai_subcategory_actor_tasks:
  - ai_development
  - ai_deployment
  - ai_impact_assessment
  - operation_and_monitoring
- ai_rmf_subcategory_id: MANAGE 2.2
  description: Mechanisms are in place and applied to sustain the value of deployed AI systems.
  gai_subcategory_actions:
  - gai_action_id: MG-2.2-001
    description: Compare GAI system outputs against pre-defined organization risk tolerance, guidelines,
      and principles, and review and test AI-generated content against these guidelines.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - obscene_degrading_or_abusive_content
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  - gai_action_id: MG-2.2-002
    description: Document training data sources to trace the origin and provenance of AI-generated content.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MG-2.2-003
    description: Evaluate feedback loops between GAI system content provenance and human reviewers, and
      update where needed. Implement real-time monitoring systems to affirm that content provenance protocols
      remain effective.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MG-2.2-004
    description: Evaluate GAI content and data for representational biases and employ techniques such
      as re-sampling, re-ranking, or adversarial training to mitigate biases in the generated content.
    gai_action_risks:
    - information_security
    - harmful_bias_or_homogenization
  - gai_action_id: MG-2.2-005
    description: Engage in due diligence to analyze GAI output for harmful content, potential misinformation,
      and CBRN-related or NCII content.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - obscene_degrading_or_abusive_content
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  - gai_action_id: MG-2.2-006
    description: Use feedback from internal and external AI Actors, users, individuals, and communities,
      to assess impact of AI-generated content.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MG-2.2-007
    description: Use real-time auditing tools where they can be demonstrated to aid in the tracking and
      validation of the lineage and authenticity of AI-generated data.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MG-2.2-008
    description: Use structured feedback mechanisms to solicit and capture user input about AI-generated
      content to detect subtle shifts in quality or alignment with community and societal values.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
  - gai_action_id: MG-2.2-009
    description: Consider opportunities to responsibly use synthetic data and other privacy enhancing
      techniques in GAI development, where appropriate and applicable, match the statistical properties
      of real-world data without disclosing personally identifiable information or contributing to homogenization.
    gai_action_risks:
    - data_privacy
    - intellectual_property
    - information_integrity
    - confabulation
    - harmful_bias_or_homogenization
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_impact_assessment
  - governance_and_oversight
  - operation_and_monitoring
- ai_rmf_subcategory_id: MANAGE 2.3
  description: Procedures are followed to respond to and recover from a previously unknown risk when it
    is identified.
  gai_subcategory_actions:
  - gai_action_id: MG-2.3-001
    description: 'Develop and update GAI system incident response and recovery plans and procedures to
      address the following: Review and maintenance of policies and procedures to account for newly encountered
      uses; Review and maintenance of policies and procedures for detection of unanticipated uses; Verify
      response and recovery plans account for the GAI system value chain; Verify response and recovery
      plans are updated for and include necessary details to communicate with downstream GAI system Actors:
      Points-of-Contact (POC), Contact information, notification format.'
    gai_action_risks:
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - operation_and_monitoring
- ai_rmf_subcategory_id: MANAGE 2.4
  description: Mechanisms are in place and applied, and responsibilities are assigned and understood,
    to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent
    with intended use.
  gai_subcategory_actions:
  - gai_action_id: MG-2.4-001
    description: Establish and maintain communication plans to inform AI stakeholders as part of the deactivation
      or disengagement process of a specific GAI system (including for open-source models) or context
      of use, including reasons, workarounds, user access removal, alternative processes, contact information,
      etc.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MG-2.4-002
    description: Establish and maintain procedures for escalating GAI system incidents to the organizational
      risk management authority when specific criteria for deactivation or disengagement is met for a
      particular context of use or for the GAI system as a whole.
    gai_action_risks:
    - information_security
  - gai_action_id: MG-2.4-003
    description: Establish and maintain procedures for the remediation of issues which trigger incident
      response processes for the use of a GAI system, and provide stakeholders timelines associated with
      the remediation plan.
    gai_action_risks:
    - information_security
  - gai_action_id: MG-2.4-004
    description: Establish and regularly review specific criteria that warrants the deactivation of GAI
      systems in accordance with set risk tolerances and appetites.
    gai_action_risks:
    - information_security
  gai_subcategory_actor_tasks:
  - ai_deployment
  - governance_and_oversight
  - operation_and_monitoring
- ai_rmf_subcategory_id: MANAGE 3.1
  description: AI risks and benefits from third-party resources are regularly monitored, and risk controls
    are applied and documented.
  gai_subcategory_actions:
  - gai_action_id: MG-3.1-001
    description: 'Apply organizational risk tolerances and controls (e.g., acquisition and procurement
      processes; assessing personnel credentials and qualifications, performing background checks; filtering
      GAI input and outputs, grounding, fine tuning, retrieval-augmented generation) to third-party GAI
      resources: Apply organizational risk tolerance to the utilization of third-party datasets and other
      GAI resources; Apply organizational risk tolerances to fine-tuned third-party models; Apply organizational
      risk tolerance to existing third-party models adapted to a new domain; Reassess risk measurements
      after fine-tuning third-party GAI models.'
    gai_action_risks:
    - value_chain_and_component_integration
    - intellectual_property
  - gai_action_id: MG-3.1-002
    description: Test GAI system value chain risks (e.g., data poisoning, malware, other software and
      hardware vulnerabilities; labor practices; data privacy and localization compliance; geopolitical
      alignment).
    gai_action_risks:
    - data_privacy
    - information_security
    - value_chain_and_component_integration
    - harmful_bias_or_homogenization
  - gai_action_id: MG-3.1-003
    description: Re-assess model risks after fine-tuning or retrieval-augmented generation implementation
      and for any third-party GAI models deployed for applications and/or use cases that were not evaluated
      in initial testing.
    gai_action_risks:
    - value_chain_and_component_integration
  - gai_action_id: MG-3.1-004
    description: Take reasonable measures to review training data for CBRN information, and intellectual
      property, and where appropriate, remove it. Implement reasonable measures to prevent, flag, or take
      other action in response to outputs that reproduce particular training data (e.g., plagiarized,
      trademarked, patented, licensed content or trade secret material).
    gai_action_risks:
    - intellectual_property
    - cbrn_information_or_capabilities
  - gai_action_id: MG-3.1-005
    description: Review various transparency artifacts (e.g., system cards and model cards) for third-party
      models.
    gai_action_risks:
    - information_integrity
    - information_security
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - operation_and_monitoring
  - third_party_entities
- ai_rmf_subcategory_id: MANAGE 3.2
  description: Pre-trained models which are used for development are monitored as part of AI system regular
    monitoring and maintenance.
  gai_subcategory_actions:
  - gai_action_id: MG-3.2-001
    description: Apply explainable AI (XAI) techniques (e.g., analysis of embeddings, model compression/distillation,
      gradient-based attributions, occlusion/term reduction, counterfactual prompts, word clouds) as part
      of ongoing continuous improvement processes to mitigate risks related to unexplainable GAI systems.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MG-3.2-002
    description: Document how pre-trained models have been adapted (e.g., fine-tuned, or retrieval-augmented
      generation) for the specific generative task, including any data augmentations, parameter adjustments,
      or other modifications. Access to un-tuned (baseline) models supports debugging the relative influence
      of the pre-trained weights compared to the fine-tuned model weights or other system updates.
    gai_action_risks:
    - information_integrity
    - data_privacy
  - gai_action_id: MG-3.2-003
    description: Document sources and types of training data and their origins, potential biases present
      in the data related to the GAI application and its content provenance, architecture, training process
      of the pre-trained model including information on hyperparameters, training duration, and any fine-tuning
      or retrieval-augmented generation processes applied.
    gai_action_risks:
    - information_integrity
    - harmful_bias_or_homogenization
    - intellectual_property
  - gai_action_id: MG-3.2-004
    description: Evaluate user reported problematic content and integrate feedback into system updates.
    gai_action_risks:
    - human_ai_configuration
    - dangerous_violent_or_hateful_content
  - gai_action_id: MG-3.2-005
    description: Implement content filters to prevent the generation of inappropriate, harmful, false,
      illegal, or violent content related to the GAI application, including for CSAM and NCII. These filters
      can be rule-based or leverage additional machine learning models to flag problematic inputs and
      outputs.
    gai_action_risks:
    - information_integrity
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
    - obscene_degrading_or_abusive_content
  - gai_action_id: MG-3.2-006
    description: Implement real-time monitoring processes for analyzing generated content performance
      and trustworthiness characteristics related to content provenance to identify deviations from the
      desired standards and trigger alerts for human intervention.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MG-3.2-007
    description: Leverage feedback and recommendations from organizational boards or committees related
      to the deployment of GAI applications and content provenance when using third-party pre-trained
      models.
    gai_action_risks:
    - information_integrity
    - value_chain_and_component_integration
  - gai_action_id: MG-3.2-008
    description: Use human moderation systems where appropriate to review generated content in accordance
      with human-AI configuration policies established in the Govern function, aligned with socio-cultural
      norms in the context of use, and for settings where AI models are demonstrated to perform poorly.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MG-3.2-009
    description: Use organizational risk tolerance to evaluate acceptable risks and performance metrics
      and decommission or retrain pre-trained models that perform outside of defined limits.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - confabulation
  gai_subcategory_actor_tasks:
  - ai_deployment
  - operation_and_monitoring
  - third_party_entities
- ai_rmf_subcategory_id: MANAGE 4.1
  description: Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing
    and evaluating input from users and other relevant AI Actors, appeal and override, decommissioning,
    incident response, recovery, and change management.
  gai_subcategory_actions:
  - gai_action_id: MG-4.1-001
    description: Collaborate with external researchers, industry experts, and community representatives
      to maintain awareness of emerging best practices and technologies in measuring and managing identified
      risks.
    gai_action_risks:
    - information_integrity
    - harmful_bias_or_homogenization
  - gai_action_id: MG-4.1-002
    description: Establish, maintain, and evaluate effectiveness of organizational processes and procedures
      for post-deployment monitoring of GAI systems, particularly for potential confabulation, CBRN, or
      cyber risks.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - confabulation
    - information_security
  - gai_action_id: MG-4.1-003
    description: Evaluate the use of sentiment analysis to gauge user sentiment regarding GAI content
      performance and impact, and work in collaboration with AI Actors experienced in user research and
      experience.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MG-4.1-004
    description: Implement active learning techniques to identify instances where the model fails or produces
      unexpected outputs.
    gai_action_risks:
    - confabulation
  - gai_action_id: MG-4.1-005
    description: Share transparency reports with internal and external stakeholders that detail steps
      taken to update the GAI system to enhance transparency and accountability.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
  - gai_action_id: MG-4.1-006
    description: Track dataset modifications for provenance by monitoring data deletions, rectification
      requests, and other changes that may impact the verifiability of content origins.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MG-4.1-007
    description: Verify that AI Actors responsible for monitoring reported issues can effectively evaluate
      GAI system performance including the application of content provenance data tracking techniques,
      and promptly escalate issues for response.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
  gai_subcategory_actor_tasks:
  - ai_deployment
  - affected_individuals_and_communities
  - domain_expert
  - end_users
  - human_factors
  - operation_and_monitoring
- ai_rmf_subcategory_id: MANAGE 4.2
  description: Measurable activities for continual improvements are integrated into AI system updates
    and include regular engagement with interested parties, including relevant AI Actors.
  gai_subcategory_actions:
  - gai_action_id: MG-4.2-001
    description: Conduct regular monitoring of GAI systems and publish reports detailing the performance,
      feedback received, and improvements made.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MG-4.2-002
    description: Practice and follow incident response plans for addressing the generation of inappropriate
      or harmful content and adapt processes based on findings to prevent future occurrences. Conduct
      post-mortem analyses of incidents with relevant AI Actors, to understand the root causes and implement
      preventive measures.
    gai_action_risks:
    - human_ai_configuration
    - dangerous_violent_or_hateful_content
  - gai_action_id: MG-4.2-003
    description: Use visualizations or other methods to represent GAI model behavior to ease non-technical
      stakeholders understanding of GAI system functionality.
    gai_action_risks:
    - human_ai_configuration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_design
  - ai_development
  - affected_individuals_and_communities
  - end_users
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MANAGE 4.3
  description: Incidents and errors are communicated to relevant AI Actors, including affected communities.
    Processes for tracking, responding to, and recovering from incidents and errors are followed and documented.
  gai_subcategory_actions:
  - gai_action_id: MG-4.3-001
    description: Conduct after-action assessments for GAI system incidents to verify incident response
      and recovery processes are followed and effective, including to follow procedures for communicating
      incidents to relevant AI Actors and where applicable, relevant legal and regulatory bodies.
    gai_action_risks:
    - information_security
  - gai_action_id: MG-4.3-002
    description: Establish and maintain policies and procedures to record and track GAI system reported
      errors, near-misses, and negative impacts.
    gai_action_risks:
    - confabulation
    - information_integrity
  - gai_action_id: MG-4.3-003
    description: Report GAI incidents in compliance with legal and regulatory requirements (e.g., HIPAA
      breach reporting, e.g., OCR (2023) or NHTSA (2022) autonomous vehicle crash reporting requirements.
    gai_action_risks:
    - information_security
    - data_privacy
  gai_subcategory_actor_tasks:
  - ai_deployment
  - affected_individuals_and_communities
  - domain_expert
  - end_users
  - human_factors
  - operation_and_monitoring
