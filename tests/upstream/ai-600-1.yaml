  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 2.13
  description: Effectiveness of the employed TEVV metrics and processes in the MEASURE function are evaluated
    and documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.13-001
    description: 'Create measurement error models for pre-deployment metrics to demonstrate construct
      validity for each metric (i.e., does the metric effectively operationalize the desired concept):
      Measure or estimate, and document, biases or statistical variance in applied metrics or structured
      human feedback processes; Leverage domain expertise when modeling complex societal constructs such
      as hateful content.'
    gai_action_risks:
    - confabulation
    - information_integrity
    - harmful_bias_or_homogenization
  gai_subcategory_actor_tasks:
  - ai_deployment
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 3.2
  description: Risk tracking approaches are considered for settings where AI risks are difficult to assess
    using currently available measurement techniques or where metrics are not yet available.
  gai_subcategory_actions:
  - gai_action_id: MS-3.2-001
    description: Establish processes for identifying emergent GAI system risks including consulting with
