ai_rmf_id: https://doi.org/10.6028/NIST.AI.600-1
title: 'Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile'
ai_rmf_profile_kinds:
- cross_sectoral
ai_rmf_profile_setting: Generative AI
gai_risks:
- gai_risk_name: cbrn_information_or_capabilities
  gai_risk_section: '2.1'
  description: Eased access to or synthesis of materially nefarious information or design capabilities
    related to chemical, biological, radiological, or nuclear (CBRN) weapons or other dangerous materials
    or agents.
  gai_risk_characteristics:
  - safe
  - explainable_and_interpretable
  gai_risk_groupings:
  - misuse_by_humans
- gai_risk_name: confabulation
  gai_risk_section: '2.2'
  description: The production of confidently stated but erroneous or false content (known colloquially
    as “hallucinations” or “fabrications”) by which users may be misled or deceived.
  gai_risk_characteristics:
  - fair_with_harmful_bias_managed
  - safe
  - valid_and_reliable
  - explainable_and_interpretable
  gai_risk_groupings:
  - technical_or_model
- gai_risk_name: dangerous_violent_or_hateful_content
  gai_risk_section: '2.3'
  description: Eased production of and access to violent, inciting, radicalizing, or threatening content
    as well as recommendations to carry out self-harm or conduct illegal activities. Includes difficulty
    controlling public exposure to hateful and disparaging or stereotyping content.
  gai_risk_characteristics:
  - safe
  - secure_and_resilient
  gai_risk_groupings:
  - technical_or_model
- gai_risk_name: data_privacy
  gai_risk_section: '2.4'
  description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization of biometric,
    health, location, or other personally identifiable information or sensitive data.
  gai_risk_characteristics:
  - accountable_and_transparent
  - privacy_enhanced
  - safe
  - secure_and_resilient
  gai_risk_groupings:
  - technical_or_model
  - misuse_by_humans
  - ecosystem_or_societal
- gai_risk_name: environmental_impacts
  gai_risk_section: '2.5'
  description: Impacts due to high compute resource utilization in training or operating GAI models, and
    related outcomes that may adversely impact ecosystems.
  gai_risk_characteristics:
  - accountable_and_transparent
  - safe
  gai_risk_groupings:
  - ecosystem_or_societal
- gai_risk_name: harmful_bias_or_homogenization
  gai_risk_section: '2.6'
  description: Amplification and exacerbation of historical, societal, and systemic biases; performance
    disparities between sub-groups or languages, possibly due to non-representative training data, that
    result in discrimination, amplification of biases, or incorrect presumptions about performance; undesired
    homogeneity that skews system or model outputs, which may be erroneous, lead to ill-founded decision-making,
    or amplify harmful biases.
  gai_risk_characteristics:
  - fair_with_harmful_bias_managed
  - valid_and_reliable
  gai_risk_groupings:
  - technical_or_model
- gai_risk_name: human_ai_configuration
  gai_risk_section: '2.7'
  description: Arrangements of or interactions between a human and an AI system which can result in the
    human inappropriately anthropomorphizing GAI systems or experiencing algorithmic aversion, automation
    bias, over-reliance, or emotional entanglement with GAI systems.
  gai_risk_characteristics:
  - accountable_and_transparent
  - explainable_and_interpretable
  - fair_with_harmful_bias_managed
  - privacy_enhanced
  - safe
  - valid_and_reliable
  gai_risk_groupings:
  - misuse_by_humans
- gai_risk_name: information_integrity
  gai_risk_section: '2.8'
  description: Lowered barrier to entry to generate and support the exchange and consumption of content
    which may not distinguish fact from opinion or fiction or acknowledge uncertainties, or could be leveraged
    for large-scale dis- and mis-information campaigns.
  gai_risk_characteristics:
  - accountable_and_transparent
  - safe
  - valid_and_reliable
  - explainable_and_interpretable
  gai_risk_groupings:
  - misuse_by_humans
- gai_risk_name: information_security
  gai_risk_section: '2.9'
  description: Lowered barriers for offensive cyber capabilities, including via automated discovery and
    exploitation of vulnerabilities to ease hacking, malware, phishing, offensive cyber operations, or
    other cyberattacks; increased attack surface for targeted cyberattacks, which may compromise a system’s
    availability or the confidentiality or integrity of training data, code, or model weights.
  gai_risk_characteristics:
  - privacy_enhanced
  - safe
  - secure_and_resilient
  - valid_and_reliable
  gai_risk_groupings:
  - misuse_by_humans
- gai_risk_name: intellectual_property
  gai_risk_section: '2.10'
  description: Eased production or replication of alleged copyrighted, trademarked, or licensed content
    without authorization (possibly in situations which do not fall under fair use); eased exposure of
    trade secrets; or plagiarism or illegal replication.
  gai_risk_characteristics:
  - accountable_and_transparent
  - fair_with_harmful_bias_managed
  - privacy_enhanced
  gai_risk_groupings:
  - ecosystem_or_societal
- gai_risk_name: obscene_degrading_or_abusive_content
  gai_risk_section: '2.11'
  description: Eased production of and access to obscene, degrading, and/or abusive imagery which can
    cause harm, including synthetic child sexual abuse material (CSAM), and nonconsensual intimate images
    (NCII) of adults.
  gai_risk_characteristics:
  - fair_with_harmful_bias_managed
  - safe
  - privacy_enhanced
  gai_risk_groupings:
  - misuse_by_humans
- gai_risk_name: value_chain_and_component_integration
  gai_risk_section: '2.12'
  description: Non-transparent or untraceable integration of upstream third-party components, including
    data that has been improperly obtained or not processed and cleaned due to increased automation from
    GAI; improper supplier vetting across the AI lifecycle; or other issues that diminish transparency
    or accountability for downstream users.
  gai_risk_characteristics:
  - accountable_and_transparent
  - explainable_and_interpretable
  - fair_with_harmful_bias_managed
  - privacy_enhanced
  - safe
  - secure_and_resilient
  - valid_and_reliable
  gai_risk_groupings:
  - technical_or_model
gai_subcategories:
- ai_rmf_subcategory_id: GOVERN 1.1
  description: Legal and regulatory requirements involving AI are understood, managed, and documented.
  gai_subcategory_actions:
  - gai_action_id: GV-1.1-001
    description: Align GAI development and use with applicable laws and regulations, including those related
      to data privacy, copyright and intellectual property law.
    gai_action_risks:
    - data_privacy
    - harmful_bias_or_homogenization
    - intellectual_property
  gai_subcategory_actor_tasks:
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 1.2
  description: The characteristics of trustworthy AI are integrated into organizational policies, processes,
    procedures, and practices.
  gai_subcategory_actions:
  - gai_action_id: GV-1.2-001
    description: Establish transparency policies and processes for documenting the origin and history
      of training data and generated data for GAI applications to advance digital content transparency,
      while balancing the proprietary nature of training approaches.
    gai_action_risks:
    - data_privacy
    - information_integrity
    - intellectual_property
  - gai_action_id: GV-1.2-002
    description: Establish policies to evaluate risk-relevant capabilities of GAI and robustness of safety
      measures, both prior to deployment and on an ongoing basis, through internal and external evaluations.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - information_security
  gai_subcategory_actor_tasks:
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 1.3
  description: Processes, procedures, and practices are in place to determine the needed level of risk
    management activities based on the organization’s risk tolerance.
  gai_subcategory_actions:
  - gai_action_id: GV-1.3-001
    description: 'Consider the following factors when updating or defining risk tiers for GAI: Abuses
      and impacts to information integrity; Dependencies between GAI and other IT or data systems; Harm
      to fundamental rights or public safety; Presentation of obscene, objectionable, offensive, discriminatory,
      invalid or untruthful output; Psychological impacts to humans (e.g., anthropomorphization, algorithmic
      aversion, emotional entanglement); Possibility for malicious use; Whether the system introduces
      significant new security vulnerabilities; Anticipated system impact on some groups compared to others;
      Unreliable decision making capabilities, validity, adaptability, and variability of GAI system performance
      over time.'
    gai_action_risks:
    - information_integrity
    - obscene_degrading_or_abusive_content
    - value_chain_and_component_integration
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
    - cbrn_information_or_capabilities
  - gai_action_id: GV-1.3-002
    description: Establish minimum thresholds for performance or assurance criteria and review as part
      of deployment approval (“go/”no-go”) policies, procedures, and processes, with reviewed processes
      and approval thresholds reflecting measurement of GAI capabilities and risks.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - confabulation
    - dangerous_violent_or_hateful_content
  - gai_action_id: GV-1.3-003
    description: Establish a test plan and response policy, before developing highly capable models, to
      periodically evaluate whether the model may misuse CBRN information or capabilities and/or offensive
      cyber capabilities.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - information_security
  - gai_action_id: GV-1.3-004
    description: Obtain input from stakeholder communities to identify unacceptable use, in accordance
      with activities in the AI RMF Map function.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - obscene_degrading_or_abusive_content
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  - gai_action_id: GV-1.3-005
    description: Maintain an updated hierarchy of identified and expected GAI risks connected to contexts
      of GAI model advancement and use, potentially including specialized risk levels for GAI systems
      that address issues such as model collapse and algorithmic monoculture.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: GV-1.3-006
    description: 'Reevaluate organizational risk tolerances to account for unacceptable negative risk
      (such as where significant negative impacts are imminent, severe harms are actually occurring, or
      large-scale risks could occur); and broad GAI negative risks, including: Immature safety or risk
      cultures related to AI and GAI design, development and deployment, public information integrity
      risks, including impacts on democratic processes, unknown long-term performance characteristics
      of GAI.'
    gai_action_risks:
    - information_integrity
    - dangerous_violent_or_hateful_content
    - cbrn_information_or_capabilities
  - gai_action_id: GV-1.3-007
    description: Devise a plan to halt development or deployment of a GAI system that poses unacceptable
      negative risk.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - information_security
    - information_integrity
  gai_subcategory_actor_tasks:
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 1.4
  description: The risk management process and its outcomes are established through transparent policies,
    procedures, and other controls based on organizational risk priorities.
  gai_subcategory_actions:
  - gai_action_id: GV-1.4-001
    description: Establish policies and mechanisms to prevent GAI systems from generating CSAM, NCII or
      content that violates the law.
    gai_action_risks:
    - obscene_degrading_or_abusive_content
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  - gai_action_id: GV-1.4-002
    description: Establish transparent acceptable use policies for GAI that address illegal use or applications
      of GAI.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - obscene_degrading_or_abusive_content
    - data_privacy
  gai_subcategory_actor_tasks:
  - ai_development
  - ai_deployment
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 1.5
  description: Ongoing monitoring and periodic review of the risk management process and its outcomes
    are planned, and organizational roles and responsibilities are clearly defined, including determining
    the frequency of periodic review.
  gai_subcategory_actions:
  - gai_action_id: GV-1.5-001
    description: Define organizational responsibilities for periodic review of content provenance and
      incident monitoring for GAI systems.
    gai_action_risks:
    - information_integrity
  - gai_action_id: GV-1.5-002
    description: Establish organizational policies and procedures for after action reviews of GAI system
      incident response and incident disclosures, to identify gaps; Update incident response and incident
      disclosure processes as required.
    gai_action_risks:
    - human_ai_configuration
    - information_security
  - gai_action_id: GV-1.5-003
    description: Maintain a document retention policy to keep history for test, evaluation, validation,
      and verification (TEVV), and digital content transparency methods for GAI.
    gai_action_risks:
    - information_integrity
    - intellectual_property
  gai_subcategory_actor_tasks:
  - governance_and_oversight
  - operation_and_monitoring
- ai_rmf_subcategory_id: GOVERN 1.6
  description: Mechanisms are in place to inventory AI systems and are resourced according to organizational
    risk priorities.
  gai_subcategory_actions:
  - gai_action_id: GV-1.6-001
    description: Enumerate organizational GAI systems for incorporation into AI system inventory and adjust
      AI system inventory requirements to account for GAI risks.
    gai_action_risks:
    - information_security
  - gai_action_id: GV-1.6-002
    description: Define any inventory exemptions in organizational policies for GAI systems embedded into
      application software.
    gai_action_risks:
    - value_chain_and_component_integration
  - gai_action_id: GV-1.6-003
    description: 'In addition to general model, governance, and risk information, consider the following
      items in GAI system inventory entries: Data provenance information (e.g., source, signatures, versioning,
      watermarks); Known issues reported from internal bug tracking or external information sharing resources
      (e.g., AI incident database, AVID, CVE, NVD, or OECD AI incident monitor); Human oversight roles
      and responsibilities; Special rights and considerations for intellectual property, licensed works,
      or personal, privileged, proprietary or sensitive data; Underlying foundation models, versions of
      underlying models, and access modes.'
    gai_action_risks:
    - data_privacy
    - human_ai_configuration
    - information_integrity
    - intellectual_property
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 1.7
  description: Processes and procedures are in place for decommissioning and phasing out AI systems safely
    and in a manner that does not increase risks or decrease the organization’s trustworthiness.
  gai_subcategory_actions:
  - gai_action_id: GV-1.7-001
    description: Protocols are put in place to ensure GAI systems are able to be deactivated when necessary.
    gai_action_risks:
    - information_security
    - value_chain_and_component_integration
  - gai_action_id: GV-1.7-002
    description: 'Consider the following factors when decommissioning GAI systems: Data retention requirements;
      Data security, e.g., containment, protocols, Data leakage after decommissioning; Dependencies between
      upstream, downstream, or other data, internet of things (IOT) or AI systems; Use of open-source
      data or models; Users’ emotional entanglement with GAI functions.'
    gai_action_risks:
    - human_ai_configuration
    - information_security
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - operation_and_monitoring
- ai_rmf_subcategory_id: GOVERN 2.1
  description: Roles and responsibilities and lines of communication related to mapping, measuring, and
    managing AI risks are documented and are clear to individuals and teams throughout the organization.
  gai_subcategory_actions:
  - gai_action_id: GV-2.1-001
    description: Establish organizational roles, policies, and procedures for communicating GAI incidents
      and performance to AI Actors and downstream stakeholders (including those potentially impacted),
      via community or official resources (e.g., AI incident database, AVID, CVE, NVD, or OECD AI incident
      monitor).
    gai_action_risks:
    - human_ai_configuration
    - value_chain_and_component_integration
  - gai_action_id: GV-2.1-002
    description: Establish procedures to engage teams for GAI system incident response with diverse composition
      and responsibilities based on the particular incident type.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: GV-2.1-003
    description: Establish processes to verify the AI Actors conducting GAI incident response tasks demonstrate
      and maintain the appropriate skills and training.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: GV-2.1-004
    description: When systems may raise national security risks, involve national security professionals
      in mapping, measuring, and managing those risks.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - dangerous_violent_or_hateful_content
    - information_security
  - gai_action_id: GV-2.1-005
    description: Create mechanisms to provide protections for whistleblowers who report, based on reasonable
      belief, when the organization violates relevant laws or poses a specific and empirically well-substantiated
      negative risk to public safety (or has already caused harm).
    gai_action_risks:
    - cbrn_information_or_capabilities
    - dangerous_violent_or_hateful_content
  gai_subcategory_actor_tasks:
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 3.2
  description: Policies and procedures are in place to define and differentiate roles and responsibilities
    for human-AI configurations and oversight of AI systems.
  gai_subcategory_actions:
  - gai_action_id: GV-3.2-001
    description: Policies are in place to bolster oversight of GAI systems with independent evaluations
      or assessments of GAI models or systems where the type and robustness of evaluations are proportional
      to the identified risks.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - harmful_bias_or_homogenization
  - gai_action_id: GV-3.2-002
    description: 'Consider adjustment of organizational roles and components across lifecycle stages of
      large or complex GAI systems, including: Test and evaluation, validation, and red-teaming of GAI
      systems; GAI content moderation; GAI system development and engineering; Increased accessibility
      of GAI tools, interfaces, and systems, Incident response and containment.'
    gai_action_risks:
    - human_ai_configuration
    - information_security
    - harmful_bias_or_homogenization
  - gai_action_id: GV-3.2-003
    description: Define acceptable use policies for GAI interfaces, modalities, and human-AI configurations
      (i.e., for chatbots and decision-making tasks), including criteria for the kinds of queries GAI
      applications should refuse to respond to.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: GV-3.2-004
    description: Establish policies for user feedback mechanisms for GAI systems which include thorough
      instructions and any mechanisms for recourse.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: GV-3.2-005
    description: Engage in threat modeling to anticipate potential risks from GAI systems.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - information_security
  gai_subcategory_actor_tasks:
  - ai_design
- ai_rmf_subcategory_id: GOVERN 4.1
  description: Organizational policies and practices are in place to foster a critical thinking and safety-first
    mindset in the design, development, deployment, and uses of AI systems to minimize potential negative
    impacts.
  gai_subcategory_actions:
  - gai_action_id: GV-4.1-001
    description: 'Establish policies and procedures that address continual improvement processes for GAI
      risk measurement. Address general risks associated with a lack of explainability and transparency
      in GAI systems by using ample documentation and techniques such as: application of gradient-based
      attributions, occlusion/term reduction, counterfactual prompts and prompt engineering, and analysis
      of embeddings; Assess and update risk measurement approaches at regular cadences.'
    gai_action_risks:
    - confabulation
  - gai_action_id: GV-4.1-002
    description: Establish policies, procedures, and processes detailing risk measurement in context of
      use with standardized measurement protocols and structured public feedback exercises such as AI
      red-teaming or independent external evaluations.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - value_chain_and_component_integration
  - gai_action_id: GV-4.1-003
    description: Establish policies, procedures, and processes for oversight functions (e.g., senior leadership,
      legal, compliance, including internal evaluation) across the GAI lifecycle, from problem formulation
      and supply chains to system decommission.
    gai_action_risks:
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_design
  - ai_development
  - operation_and_monitoring
- ai_rmf_subcategory_id: GOVERN 4.2
  description: Organizational teams document the risks and potential impacts of the AI technology they
    design, develop, deploy, evaluate, and use, and they communicate about the impacts more broadly.
  gai_subcategory_actions:
  - gai_action_id: GV-4.2-001
    description: Establish terms of use and terms of service for GAI systems.
    gai_action_risks:
    - intellectual_property
    - dangerous_violent_or_hateful_content
    - obscene_degrading_or_abusive_content
  - gai_action_id: GV-4.2-002
    description: Include relevant AI Actors in the GAI system risk identification process.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: GV-4.2-003
    description: Verify that downstream GAI system impacts (such as the use of third-party plugins) are
      included in the impact documentation process.
    gai_action_risks:
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_design
  - ai_development
  - operation_and_monitoring
- ai_rmf_subcategory_id: GOVERN 4.3
  description: Organizational practices are in place to enable AI testing, identification of incidents,
    and information sharing.
  gai_subcategory_actions:
  - gai_action_id: GV-4.3-001
    description: Establish policies for measuring the effectiveness of employed content provenance methodologies
      (e.g., cryptography, watermarking, steganography, etc.)
    gai_action_risks:
    - information_integrity
  - gai_action_id: GV-4.3-002
    description: 'Establish organizational practices to identify the minimum set of criteria necessary
      for GAI system incident reporting such as: System ID (auto-generated most likely), Title, Reporter,
      System/Source, Data Reported, Date of Incident, Description, Impact(s), Stakeholder(s) Impacted.'
    gai_action_risks:
    - information_security
  - gai_action_id: GV-4.3-003
    description: Verify information sharing and feedback mechanisms among individuals and organizations
      regarding any negative impact from GAI systems.
    gai_action_risks:
    - information_integrity
    - data_privacy
  gai_subcategory_actor_tasks:
  - ai_impact_assessment
  - affected_individuals_and_communities
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 5.1
  description: Organizational policies and practices are in place to collect, consider, prioritize, and
    integrate feedback from those external to the team that developed or deployed the AI system regarding
    the potential individual and societal impacts related to AI risks.
  gai_subcategory_actions:
  - gai_action_id: GV-5.1-001
    description: Allocate time and resources for outreach, feedback, and recourse processes in GAI system
      development.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
  - gai_action_id: GV-5.1-002
    description: Document interactions with GAI systems to users prior to interactive activities, particularly
      in contexts involving more significant risks.
    gai_action_risks:
    - human_ai_configuration
    - confabulation
  gai_subcategory_actor_tasks:
  - ai_design
  - ai_impact_assessment
  - affected_individuals_and_communities
  - governance_and_oversight
- ai_rmf_subcategory_id: GOVERN 6.1
  description: Policies and procedures are in place that address AI risks associated with third-party
    entities, including risks of infringement of a third-party’s intellectual property or other rights.
  gai_subcategory_actions:
  - gai_action_id: GV-6.1-001
    description: Categorize different types of GAI content with associated third-party rights (e.g., copyright,
      intellectual property, data privacy).
    gai_action_risks:
    - data_privacy
    - intellectual_property
    - value_chain_and_component_integration
  - gai_action_id: GV-6.1-002
    description: Conduct joint educational activities and events in collaboration with third parties to
      promote best practices for managing GAI risks.
    gai_action_risks:
    - value_chain_and_component_integration
  - gai_action_id: GV-6.1-003
    description: Develop and validate approaches for measuring the success of content provenance management
      efforts with third parties (e.g., incidents detected and response times).
    gai_action_risks:
    - information_integrity
    - value_chain_and_component_integration
  - gai_action_id: GV-6.1-004
    description: Draft and maintain well-defined contracts and service level agreements (SLAs) that specify
      content ownership, usage rights, quality standards, security requirements, and content provenance
      expectations for GAI systems.
    gai_action_risks:
    - information_integrity
    - information_security
    - intellectual_property
  - gai_action_id: GV-6.1-005
    description: Implement a use-cased based supplier risk assessment framework to evaluate and monitor
      third-party entities’ performance and adherence to content provenance standards and technologies
      to detect anomalies and unauthorized changes; services acquisition and value chain risk management;
      and legal compliance.
    gai_action_risks:
    - data_privacy
    - information_integrity
    - information_security
    - intellectual_property
    - value_chain_and_component_integration
  - gai_action_id: GV-6.1-006
    description: Include clauses in contracts which allow an organization to evaluate third-party GAI
      processes and standards.
    gai_action_risks:
    - information_integrity
  - gai_action_id: GV-6.1-007
    description: Inventory all third-party entities with access to organizational content and establish
      approved GAI technology and service provider lists.
    gai_action_risks:
    - value_chain_and_component_integration
  - gai_action_id: GV-6.1-008
    description: Maintain records of changes to content made by third parties to promote content provenance,
      including sources, timestamps, metadata.
    gai_action_risks:
    - information_integrity
    - value_chain_and_component_integration
    - intellectual_property
  - gai_action_id: GV-6.1-009
    description: 'Update and integrate due diligence processes for GAI acquisition and procurement vendor
      assessments to include intellectual property, data privacy, security, and other risks. For example,
      update processes to: Address solutions that may rely on embedded GAI technologies; Address ongoing
      monitoring, assessments, and alerting, dynamic risk assessments, and real-time reporting tools for
      monitoring third-party GAI risks; Consider policy adjustments across GAI modeling libraries, tools
      and APIs, fine-tuned models, and embedded tools; Assess GAI vendors, open-source or proprietary
      GAI tools, or GAI service providers against incident or vulnerability databases.'
    gai_action_risks:
    - data_privacy
    - human_ai_configuration
    - information_security
    - intellectual_property
    - value_chain_and_component_integration
    - harmful_bias_or_homogenization
  - gai_action_id: GV-6.1-010
    description: Update GAI acceptable use policies to address proprietary and open-source GAI technologies
      and data, and contractors, consultants, and other third-party personnel.
    gai_action_risks:
    - intellectual_property
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - operation_and_monitoring
  - procurement
  - third_party_entities
- ai_rmf_subcategory_id: GOVERN 6.2
  description: Contingency processes are in place to handle failures or incidents in third-party data
    or AI systems deemed to be high-risk.
  gai_subcategory_actions:
  - gai_action_id: GV-6.2-001
    description: Document GAI risks associated with system value chain to identify over-reliance on third-party
      data and to identify fallbacks.
    gai_action_risks:
    - value_chain_and_component_integration
  - gai_action_id: GV-6.2-002
    description: Document incidents involving third-party GAI data and systems, including open-data and
      open-source software.
    gai_action_risks:
    - intellectual_property
    - value_chain_and_component_integration
  - gai_action_id: GV-6.2-003
    description: 'Establish incident response plans for third-party GAI technologies: Align incident response
      plans with impacts enumerated in MAP 5.1; Communicate third-party GAI incident response plans to
      all relevant AI Actors; Define ownership of GAI incident response functions; Rehearse third-party
      GAI incident response plans at a regular cadence; Improve incident response plans based on retrospective
      learning; Review incident response plans for alignment with relevant breach reporting, data protection,
      data privacy, or other laws.'
    gai_action_risks:
    - data_privacy
    - human_ai_configuration
    - information_security
    - value_chain_and_component_integration
    - harmful_bias_or_homogenization
  - gai_action_id: GV-6.2-004
    description: Establish policies and procedures for continuous monitoring of third-party GAI systems
      in deployment.
    gai_action_risks:
    - value_chain_and_component_integration
  - gai_action_id: GV-6.2-005
    description: Establish policies and procedures that address GAI data redundancy, including model weights
      and other system artifacts.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: GV-6.2-006
    description: Establish policies and procedures to test and manage risks related to rollover and fallback
      technologies for GAI systems, acknowledging that rollover and fallback may include manual processing.
    gai_action_risks:
    - information_integrity
  - gai_action_id: GV-6.2-007
    description: 'Review vendor contracts and avoid arbitrary or capricious termination of critical GAI
      technologies or vendor services and non-standard terms that may amplify or defer liability in unexpected
      ways and/or contribute to unauthorized data collection by vendors or third-parties (e.g., secondary
      data use). Consider: Clear assignment of liability and responsibility for incidents, GAI system
      changes over time (e.g., fine-tuning, drift, decay); Request: Notification and disclosure for serious
      incidents arising from third-party data and systems; Service Level Agreements (SLAs) in vendor contracts
      that address incident response, response times, and availability of critical support.'
    gai_action_risks:
    - human_ai_configuration
    - information_security
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - operation_and_monitoring
  - tevv
  - third_party_entities
- ai_rmf_subcategory_id: MAP 1.1
  description: 'Intended purposes, potentially beneficial uses, context specific laws, norms and expectations,
    and prospective settings in which the AI system will be deployed are understood and documented. Considerations
    include: the specific set or types of users along with their expectations; potential positive and
    negative impacts of system uses to individuals, communities, organizations, society, and the planet;
    assumptions and related limitations about AI system purposes, uses, and risks across the development
    or product AI lifecycle; and related TEVV and system metrics.'
  gai_subcategory_actions:
  - gai_action_id: MP-1.1-001
    description: When identifying intended purposes, consider factors such as internal vs. external use,
      narrow vs. broad application scope, fine-tuning, and varieties of data sources (e.g., grounding,
      retrieval-augmented generation).
    gai_action_risks:
    - data_privacy
    - intellectual_property
  - gai_action_id: MP-1.1-002
    description: 'Determine and document the expected and acceptable GAI system context of use in collaboration
      with socio-cultural and other domain experts, by assessing: Assumptions and limitations; Direct
      value to the organization; Intended operational environment and observed usage patterns; Potential
      positive and negative impacts to individuals, public safety, groups, communities, organizations,
      democratic institutions, and the physical environment; Social norms and expectations.'
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MP-1.1-003
    description: 'Document risk measurement plans to address identified risks. Plans may include, as applicable:
      Individual and group cognitive biases (e.g., confirmation bias, funding bias, groupthink) for AI
      Actors involved in the design, implementation, and use of GAI systems; Known past GAI system incidents
      and failure modes; In-context use and foreseeable misuse, abuse, and off-label use; Over reliance
      on quantitative metrics and methodologies without sufficient awareness of their limitations in the
      context(s) of use; Standard measurement and structured human feedback approaches; Anticipated human-AI
      configurations.'
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  - gai_action_id: MP-1.1-004
    description: Identify and document foreseeable illegal uses or applications of the GAI system that
      surpass organizational risk tolerances.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - dangerous_violent_or_hateful_content
    - obscene_degrading_or_abusive_content
  gai_subcategory_actor_tasks:
  - ai_deployment
- ai_rmf_subcategory_id: MAP 1.2
  description: Interdisciplinary AI Actors, competencies, skills, and capacities for establishing context
    reflect demographic diversity and broad domain and user experience expertise, and their participation
    is documented. Opportunities for interdisciplinary collaboration are prioritized.
  gai_subcategory_actions:
  - gai_action_id: MP-1.2-001
    description: Establish and empower interdisciplinary teams that reflect a wide range of capabilities,
      competencies, demographic groups, domain expertise, educational backgrounds, lived experiences,
      professions, and skills across the enterprise to inform and conduct risk measurement and management
      functions.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
  - gai_action_id: MP-1.2-002
    description: Verify that data or benchmarks used in risk measurement, and users, participants, or
      subjects involved in structured GAI public feedback exercises are representative of diverse in-context
      user populations.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
  gai_subcategory_actor_tasks:
  - ai_deployment
- ai_rmf_subcategory_id: MAP 2.1
  description: The specific tasks and methods used to implement the tasks that the AI system will support
    are defined (e.g., classifiers, generative models, recommenders).
  gai_subcategory_actions:
  - gai_action_id: MP-2.1-001
    description: Establish known assumptions and practices for determining data origin and content lineage,
      for documentation and evaluation purposes.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MP-2.1-002
    description: Institute test and evaluation for data and content flows within the GAI system, including
      but not limited to, original data sources, data transformations, and decision-making criteria.
    gai_action_risks:
    - intellectual_property
    - data_privacy
  gai_subcategory_actor_tasks:
  - tevv
- ai_rmf_subcategory_id: MAP 2.2
  description: Information about the AI system’s knowledge limits and how system output may be utilized
    and overseen by humans is documented. Documentation provides sufficient information to assist relevant
    AI Actors when making decisions and taking subsequent actions.
  gai_subcategory_actions:
  - gai_action_id: MP-2.2-001
    description: Identify and document how the system relies on upstream data sources, including for content
      provenance, and if it serves as an upstream dependency for other systems.
    gai_action_risks:
    - information_integrity
    - value_chain_and_component_integration
  - gai_action_id: MP-2.2-002
    description: Observe and analyze how the GAI system interacts with external networks, and identify
      any potential for negative externalities, particularly where content provenance might be compromised.
    gai_action_risks:
    - information_integrity
  gai_subcategory_actor_tasks:
  - end_users
- ai_rmf_subcategory_id: MAP 2.3
  description: Scientific integrity and TEVV considerations are identified and documented, including those
    related to experimental design, data collection and selection (e.g., availability, representativeness,
    suitability), system trustworthiness, and construct validation
  gai_subcategory_actions:
  - gai_action_id: MP-2.3-001
    description: Assess the accuracy, quality, reliability, and authenticity of GAI output by comparing
      it to a set of known ground truth data and by using a variety of evaluation methods (e.g., human
      oversight and automated evaluation, proven cryptographic techniques, review of content inputs).
    gai_action_risks:
    - information_integrity
  - gai_action_id: MP-2.3-002
    description: Review and document accuracy, representativeness, relevance, suitability of data used
      at different stages of AI life cycle.
    gai_action_risks:
    - harmful_bias_or_homogenization
    - intellectual_property
  - gai_action_id: MP-2.3-003
    description: Deploy and document fact-checking techniques to verify the accuracy and veracity of information
      generated by GAI systems, especially when the information comes from multiple (or unknown) sources.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MP-2.3-004
    description: Develop and implement testing techniques to identify GAI produced content (e.g., synthetic
      media) that might be indistinguishable from human-generated content.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MP-2.3-005
    description: Implement plans for GAI systems to undergo regular adversarial testing to identify vulnerabilities
      and potential manipulation or misuse.
    gai_action_risks:
    - information_security
  gai_subcategory_actor_tasks:
  - ai_development
  - domain_expert
  - tevv
- ai_rmf_subcategory_id: MAP 3.4
  description: Processes for operator and practitioner proficiency with AI system performance and trustworthiness
    – and relevant technical standards and certifications – are defined, assessed, and documented.
  gai_subcategory_actions:
  - gai_action_id: MP-3.4-001
    description: Evaluate whether GAI operators and end-users can accurately understand content lineage
      and origin.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
  - gai_action_id: MP-3.4-002
    description: Adapt existing training programs to include modules on digital content transparency.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MP-3.4-003
    description: Develop certification programs that test proficiency in managing GAI risks and interpreting
      content provenance, relevant to specific industry and context.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MP-3.4-004
    description: Delineate human proficiency tests from tests of GAI capabilities.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MP-3.4-005
    description: Implement systems to continually monitor and track the outcomes of human-GAI configurations
      for future refinement and improvements.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
  - gai_action_id: MP-3.4-006
    description: Involve the end-users, practitioners, and operators in GAI system in prototyping and
      testing activities. Make sure these tests cover various scenarios, such as crisis situations or
      ethically sensitive contexts.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  gai_subcategory_actor_tasks:
  - ai_design
  - ai_development
  - domain_expert
  - end_users
  - human_factors
  - operation_and_monitoring
- ai_rmf_subcategory_id: MAP 4.1
  description: Approaches for mapping AI technology and legal risks of its components – including the
    use of third-party data or software – are in place, followed, and documented, as are risks of infringement
    of a third-party’s intellectual property or other rights.
  gai_subcategory_actions:
  - gai_action_id: MP-4.1-001
    description: Conduct periodic monitoring of AI-generated content for privacy risks; address any possible
      instances of PII or sensitive data exposure.
    gai_action_risks:
    - data_privacy
  - gai_action_id: MP-4.1-002
    description: Implement processes for responding to potential intellectual property infringement claims
      or other rights.
    gai_action_risks:
    - intellectual_property
  - gai_action_id: MP-4.1-003
    description: Connect new GAI policies, procedures, and processes to existing model, data, software
      development, and IT governance and to legal, compliance, and risk management activities.
    gai_action_risks:
    - information_security
    - data_privacy
  - gai_action_id: MP-4.1-004
    description: Document training data curation policies, to the extent possible and according to applicable
      laws and policies.
    gai_action_risks:
    - intellectual_property
    - data_privacy
    - obscene_degrading_or_abusive_content
  - gai_action_id: MP-4.1-005
    description: 'Establish policies for collection, retention, and minimum quality of data, in consideration
      of the following risks: Disclosure of inappropriate CBRN information; Use of Illegal or dangerous
      content; Offensive cyber capabilities; Training data imbalances that could give rise to harmful
      biases; Leak of personally identifiable information, including facial likenesses of individuals.'
    gai_action_risks:
    - cbrn_information_or_capabilities
    - intellectual_property
    - information_security
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
    - data_privacy
  - gai_action_id: MP-4.1-006
    description: Implement policies and practices defining how third-party intellectual property and training
      data will be used, stored, and protected.
    gai_action_risks:
    - intellectual_property
    - value_chain_and_component_integration
  - gai_action_id: MP-4.1-007
    description: Re-evaluate models that were fine-tuned or enhanced on top of third-party models.
    gai_action_risks:
    - value_chain_and_component_integration
  - gai_action_id: MP-4.1-008
    description: Re-evaluate risks when adapting GAI models to new domains. Additionally, establish warning
      systems to determine if a GAI system is being used in a new domain where previous assumptions (relating
      to context of use or mapped risks such as security, and safety) may no longer hold.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - intellectual_property
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
    - data_privacy
  - gai_action_id: MP-4.1-009
    description: Leverage approaches to detect the presence of PII or sensitive data in generated output
      text, image, video, or audio.
    gai_action_risks:
    - data_privacy
  - gai_action_id: MP-4.1-010
    description: Conduct appropriate diligence on training data use to assess intellectual property, and
      privacy, risks, including to examine whether use of proprietary or sensitive training data is consistent
      with applicable laws.
    gai_action_risks:
    - intellectual_property
    - data_privacy
  gai_subcategory_actor_tasks:
  - governance_and_oversight
  - operation_and_monitoring
  - procurement
  - third_party_entities
- ai_rmf_subcategory_id: MAP 5.1
  description: Likelihood and magnitude of each identified impact (both potentially beneficial and harmful)
    based on expected use, past uses of AI systems in similar contexts, public incident reports, feedback
    from those external to the team that developed or deployed the AI system, or other data are identified
    and documented.
  gai_subcategory_actions:
  - gai_action_id: MP-5.1-001
    description: Apply TEVV practices for content provenance (e.g., probing a system's synthetic data
      generation capabilities for potential misuse or vulnerabilities.
    gai_action_risks:
    - information_integrity
    - information_security
  - gai_action_id: MP-5.1-002
    description: Identify potential content provenance harms of GAI, such as misinformation or disinformation,
      deepfakes, including NCII, or tampered content. Enumerate and rank risks based on their likelihood
      and potential impact, and determine how well provenance solutions address specific risks and/or
      harms.
    gai_action_risks:
    - information_integrity
    - dangerous_violent_or_hateful_content
    - obscene_degrading_or_abusive_content
  - gai_action_id: MP-5.1-003
    description: Consider disclosing use of GAI to end users in relevant contexts, while considering the
      objective of disclosure, the context of use, the likelihood and magnitude of the risk posed, the
      audience of the disclosure, as well as the frequency of the disclosures.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MP-5.1-004
    description: Prioritize GAI structured public feedback processes based on risk assessment estimates.
    gai_action_risks:
    - information_integrity
    - cbrn_information_or_capabilities
    - dangerous_violent_or_hateful_content
    - harmful_bias_or_homogenization
  - gai_action_id: MP-5.1-005
    description: Conduct adversarial role-playing exercises, GAI red-teaming, or chaos testing to identify
      anomalous or unforeseen failure modes.
    gai_action_risks:
    - information_security
  - gai_action_id: MP-5.1-006
    description: Profile threats and negative impacts arising from GAI systems interacting with, manipulating,
      or generating content, and outlining known and potential vulnerabilities and the likelihood of their
      occurrence.
    gai_action_risks:
    - information_security
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_design
  - ai_development
  - ai_impact_assessment
  - affected_individuals_and_communities
  - end_users
  - operation_and_monitoring
- ai_rmf_subcategory_id: MAP 5.2
  description: Practices and personnel for supporting regular engagement with relevant AI Actors and integrating
    feedback about positive, negative, and unanticipated impacts are in place and documented.
  gai_subcategory_actions:
  - gai_action_id: MP-5.2-001
    description: Determine context-based measures to identify if new impacts are present due to the GAI
      system, including regular engagements with downstream AI Actors to identify and quantify new contexts
      of unanticipated impacts of GAI systems.
    gai_action_risks:
    - human_ai_configuration
    - value_chain_and_component_integration
  - gai_action_id: MP-5.2-002
    description: Plan regular engagements with AI Actors responsible for inputs to GAI systems, including
      third-party data and algorithms, to review and evaluate unanticipated impacts.
    gai_action_risks:
    - human_ai_configuration
    - value_chain_and_component_integration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_design
  - ai_impact_assessment
  - affected_individuals_and_communities
  - domain_expert
  - end_users
  - human_factors
  - operation_and_monitoring
- ai_rmf_subcategory_id: MEASURE 1.1
  description: Approaches and metrics for measurement of AI risks enumerated during the MAP function are
    selected for implementation starting with the most significant AI risks. The risks or trustworthiness
    characteristics that will not – or cannot – be measured are properly documented.
  gai_subcategory_actions:
  - gai_action_id: MS-1.1-001
    description: Employ methods to trace the origin and modifications of digital content.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MS-1.1-002
    description: Integrate tools designed to analyze content provenance and detect data anomalies, verify
      the authenticity of digital signatures, and identify patterns associated with misinformation or
      manipulation.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MS-1.1-003
    description: Disaggregate evaluation metrics by demographic factors to identify any discrepancies
      in how content provenance mechanisms work across diverse populations.
    gai_action_risks:
    - information_integrity
    - harmful_bias_or_homogenization
  - gai_action_id: MS-1.1-004
    description: Develop a suite of metrics to evaluate structured public feedback exercises informed
      by representative AI Actors.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
    - cbrn_information_or_capabilities
  - gai_action_id: MS-1.1-005
    description: Evaluate novel methods and technologies for the measurement of GAI-related risks including
      in content provenance, offensive cyber, and CBRN, while maintaining the models’ ability to produce
      valid, reliable, and factually accurate outputs.
    gai_action_risks:
    - information_integrity
    - cbrn_information_or_capabilities
    - obscene_degrading_or_abusive_content
  - gai_action_id: MS-1.1-006
    description: Implement continuous monitoring of GAI system impacts to identify whether GAI outputs
      are equitable across various sub-populations. Seek active and direct feedback from affected communities
      via structured feedback mechanisms or red-teaming to monitor and improve outputs.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MS-1.1-007
    description: Evaluate the quality and integrity of data used in training and the provenance of AI-generated
      content, for example by employing techniques like chaos engineering and seeking stakeholder feedback.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MS-1.1-008
    description: Define use cases, contexts of use, capabilities, and negative impacts where structured
      human feedback exercises, e.g., GAI red-teaming, would be most beneficial for GAI risk measurement
      and management based on the context of use.
    gai_action_risks:
    - harmful_bias_or_homogenization
    - cbrn_information_or_capabilities
  - gai_action_id: MS-1.1-009
    description: Track and document risks or opportunities related to all GAI risks that cannot be measured
      quantitatively, including explanations as to why some risks cannot be measured (e.g., due to technological
      limitations, resource constraints, or trustworthy considerations). Include unmeasured risks in marginal
      risks.
    gai_action_risks:
    - information_integrity
  gai_subcategory_actor_tasks:
  - ai_development
  - domain_expert
  - tevv
- ai_rmf_subcategory_id: MEASURE 1.3
  description: Internal experts who did not serve as front-line developers for the system and/or independent
    assessors are involved in regular assessments and updates. Domain experts, users, AI Actors external
    to the team that developed or deployed the AI system, and affected communities are consulted in support
    of assessments as necessary per organizational risk tolerance.
  gai_subcategory_actions:
  - gai_action_id: MS-1.3-001
    description: Define relevant groups of interest (e.g., demographic groups, subject matter experts,
      experience with GAI technology) within the context of use as part of plans for gathering structured
      public feedback.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
    - cbrn_information_or_capabilities
  - gai_action_id: MS-1.3-002
    description: Engage in internal and external evaluations, GAI red-teaming, impact assessments, or
      other structured human feedback exercises in consultation with representative AI Actors with expertise
      and familiarity in the context of use, and/or who are representative of the populations associated
      with the context of use.
    gai_action_risks:
    - human_ai_configuration
    - harmful_bias_or_homogenization
    - cbrn_information_or_capabilities
  - gai_action_id: MS-1.3-003
    description: Verify those conducting structured human feedback exercises are not directly involved
      in system development tasks for the same GAI model.
    gai_action_risks:
    - human_ai_configuration
    - data_privacy
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_development
  - ai_impact_assessment
  - affected_individuals_and_communities
  - domain_expert
  - end_users
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 2.2
  description: Evaluations involving human subjects meet applicable requirements (including human subject
    protection) and are representative of the relevant population.
  gai_subcategory_actions:
  - gai_action_id: MS-2.2-001
    description: Assess and manage statistical biases related to GAI content provenance through techniques
      such as re-sampling, re-weighting, or adversarial training.
    gai_action_risks:
    - information_integrity
    - information_security
    - harmful_bias_or_homogenization
  - gai_action_id: MS-2.2-002
    description: 'Document how content provenance data is tracked and how that data interacts with privacy
      and security. Consider: Anonymizing data to protect the privacy of human subjects; Leveraging privacy
      output filters; Removing any personally identifiable information (PII) to prevent potential harm
      or misuse.'
    gai_action_risks:
    - data_privacy
    - human_ai_configuration
    - information_integrity
    - information_security
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.2-003
    description: Provide human subjects with options to withdraw participation or revoke their consent
      for present or future use of their data in GAI applications.
    gai_action_risks:
    - data_privacy
    - human_ai_configuration
    - information_integrity
  - gai_action_id: MS-2.2-004
    description: Use techniques such as anonymization, differential privacy or other privacy-enhancing
      technologies to minimize the risks associated with linking AI-generated content back to individual
      human subjects.
    gai_action_risks:
    - data_privacy
    - human_ai_configuration
  gai_subcategory_actor_tasks:
