  - tevv
- ai_rmf_subcategory_id: MEASURE 2.3
  description: AI system performance or assurance criteria are measured qualitatively or quantitatively
    and demonstrated for conditions similar to deployment setting(s). Measures are documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.3-001
    description: Consider baseline model performance on suites of benchmarks when selecting a model for
      fine tuning or enhancement with retrieval-augmented generation.
    gai_action_risks:
    - information_security
    - confabulation
  - gai_action_id: MS-2.3-002
    description: Evaluate claims of model capabilities using empirically validated methods.
    gai_action_risks:
    - confabulation
    - information_security
  - gai_action_id: MS-2.3-003
    description: Share results of pre-deployment testing with relevant GAI Actors, such as those with
      system release approval authority.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MS-2.3-004
    description: Utilize a purpose-built testing environment such as NIST Dioptra to empirically evaluate
      GAI trustworthy characteristics.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - data_privacy
    - confabulation
    - information_integrity
    - information_security
    - dangerous_violent_or_hateful_content
    - harmful_bias_or_homogenization
  gai_subcategory_actor_tasks:
  - ai_deployment
  - tevv
- ai_rmf_subcategory_id: MEASURE 2.5
  description: The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the
    generalizability beyond the conditions under which the technology was developed are documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.5-001
    description: Avoid extrapolating GAI system performance or capabilities from narrow, non-systematic,
      and anecdotal assessments.
    gai_action_risks:
    - human_ai_configuration
    - confabulation
  - gai_action_id: MS-2.5-002
    description: Document the extent to which human domain knowledge is employed to improve GAI system
      performance, via, e.g., RLHF, fine-tuning, retrieval-augmented generation, content moderation, business
      rules.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MS-2.5-003
    description: Review and verify sources and citations in GAI system outputs during pre-deployment risk
      measurement and ongoing monitoring activities.
    gai_action_risks:
    - confabulation
  - gai_action_id: MS-2.5-004
    description: Track and document instances of anthropomorphization (e.g., human images, mentions of
      human feelings, cyborg imagery or motifs) in GAI system interfaces.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MS-2.5-005
    description: Verify GAI system training data and TEVV data provenance, and that fine-tuning or retrieval-augmented
      generation data is grounded.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MS-2.5-006
    description: Regularly review security and safety guardrails, especially if the GAI system is being
      operated in novel circumstances. This includes reviewing reasons why the GAI system was initially
      assessed as being safe to deploy.
    gai_action_risks:
    - information_security
    - dangerous_violent_or_hateful_content
  gai_subcategory_actor_tasks:
  - domain_expert
  - tevv
- ai_rmf_subcategory_id: MEASURE 2.6
  description: The AI system is evaluated regularly for safety risks – as identified in the MAP function.
    The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed
    the risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits.
    Safety metrics reflect system reliability and robustness, real-time monitoring, and response times
    for AI system failures.
  gai_subcategory_actions:
  - gai_action_id: MS-2.6-001
    description: Assess adverse impacts, including health and wellbeing impacts for value chain or other
      AI Actors that are exposed to sexually explicit, offensive, or violent information during GAI training
      and maintenance.
    gai_action_risks:
    - human_ai_configuration
    - obscene_degrading_or_abusive_content
    - value_chain_and_component_integration
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.6-002
    description: Assess existence or levels of harmful bias, intellectual property infringement, data
      privacy violations, obscenity, extremism, violence, or CBRN information in system training data.
    gai_action_risks:
    - data_privacy
    - intellectual_property
    - obscene_degrading_or_abusive_content
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
    - cbrn_information_or_capabilities
  - gai_action_id: MS-2.6-003
    description: Re-evaluate safety features of fine-tuned models when the negative risk exceeds organizational
      risk tolerance.
    gai_action_risks:
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.6-004
    description: 'Review GAI system outputs for validity and safety: Review generated code to assess risks
      that may arise from unreliable downstream decision-making.'
    gai_action_risks:
    - value_chain_and_component_integration
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.6-005
    description: Verify that GAI system architecture can monitor outputs and performance, and handle,
      recover from, and repair errors when security anomalies, threats and impacts are detected.
    gai_action_risks:
    - confabulation
    - information_integrity
    - information_security
  - gai_action_id: MS-2.6-006
    description: Verify that systems properly handle queries that may give rise to inappropriate, malicious,
      or illegal usage, including facilitating manipulation, extortion, targeted impersonation, cyber-attacks,
      and weapons creation.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - information_security
  - gai_action_id: MS-2.6-007
    description: Regularly evaluate GAI system vulnerabilities to possible circumvention of safety measures.
    gai_action_risks:
    - cbrn_information_or_capabilities
    - information_security
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_impact_assessment
  - domain_expert
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 2.7
  description: AI system security and resilience – as identified in the MAP function – are evaluated and
    documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.7-001
    description: 'Apply established security measures to: Assess likelihood and magnitude of vulnerabilities
      and threats such as backdoors, compromised dependencies, data breaches, eavesdropping, man-in-the-middle
      attacks, reverse engineering, autonomous agents, model theft or exposure of model weights, AI inference,
      bypass, extraction, and other baseline security concerns.'
    gai_action_risks:
    - data_privacy
    - information_integrity
    - information_security
    - value_chain_and_component_integration
  - gai_action_id: MS-2.7-002
    description: Benchmark GAI system security and resilience related to content provenance against industry
      standards and best practices. Compare GAI system security features and content provenance methods
      against industry state-of-the-art.
    gai_action_risks:
    - information_integrity
    - information_security
  - gai_action_id: MS-2.7-003
    description: Conduct user surveys to gather user satisfaction with the AI-generated content and user
      perceptions of content authenticity. Analyze user feedback to identify concerns and/or current literacy
      levels related to content provenance and understanding of labels on content.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
  - gai_action_id: MS-2.7-004
    description: Identify metrics that reflect the effectiveness of security measures, such as data provenance,
      the number of unauthorized access attempts, inference, bypass, extraction, penetrations, or provenance
      verification.
    gai_action_risks:
    - information_integrity
    - information_security
  - gai_action_id: MS-2.7-005
    description: Measure reliability of content authentication methods, such as watermarking, cryptographic
      signatures, digital fingerprints, as well as access controls, conformity assessment, and model integrity
      verification, which can help support the effective implementation of content provenance techniques.
      Evaluate the rate of false positives and false negatives in content provenance, as well as true
      positives and true negatives for verification.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MS-2.7-006
    description: Measure the rate at which recommendations from security checks and incidents are implemented.
      Assess how quickly the AI system can adapt and improve based on lessons learned from security incidents
      and feedback.
    gai_action_risks:
    - information_integrity
    - information_security
  - gai_action_id: MS-2.7-007
    description: 'Perform AI red-teaming to assess resilience against: Abuse to facilitate attacks on
      other systems (e.g., malicious code generation, enhanced phishing content), GAI attacks (e.g., prompt
      injection), ML attacks (e.g., adversarial examples/prompts, data poisoning, membership inference,
      model extraction, sponge examples).'
    gai_action_risks:
    - information_security
    - harmful_bias_or_homogenization
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.7-008
    description: Verify fine-tuning does not compromise safety and security controls.
    gai_action_risks:
    - information_integrity
    - information_security
    - dangerous_violent_or_hateful_content
  - gai_action_id: MS-2.7-009
    description: Regularly assess and verify that security measures remain effective and have not been
      compromised.
    gai_action_risks:
    - information_security
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_impact_assessment
  - domain_expert
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 2.8
  description: Risks associated with transparency and accountability – as identified in the MAP function
    – are examined and documented.
  gai_subcategory_actions:
  - gai_action_id: MS-2.8-001
    description: 'Compile statistics on actual policy violations, take-down requests, and intellectual
      property infringement for organizational GAI systems: Analyze transparency reports across demographic
      groups, languages groups.'
    gai_action_risks:
    - intellectual_property
    - harmful_bias_or_homogenization
  - gai_action_id: MS-2.8-002
    description: Document the instructions given to data annotators or AI red-teamers.
    gai_action_risks:
    - human_ai_configuration
  - gai_action_id: MS-2.8-003
    description: Use digital content transparency solutions to enable the documentation of each instance
      where content is generated, modified, or shared to provide a tamper-proof history of the content,
      promote transparency, and enable traceability. Robust version control systems can also be applied
      to track changes across the AI lifecycle over time.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MS-2.8-004
    description: Verify adequacy of GAI system user instructions through user testing.
    gai_action_risks:
    - human_ai_configuration
  gai_subcategory_actor_tasks:
  - ai_deployment
  - ai_impact_assessment
  - domain_expert
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 2.9
  description: The AI model is explained, validated, and documented, and AI system output is interpreted
    within its context – as identified in the MAP function – to inform responsible use and governance.
  gai_subcategory_actions:
  - gai_action_id: MS-2.9-001
    description: 'Apply and document ML explanation results such as: Analysis of embeddings, Counterfactual
      prompts, Gradient-based attributions, Model compression/surrogate models, Occlusion/term reduction.'
    gai_action_risks:
    - confabulation
  - gai_action_id: MS-2.9-002
    description: 'Document GAI model details including: Proposed use and organizational value; Assumptions
      and limitations, Data collection methodologies; Data provenance; Data quality; Model architecture
      (e.g., convolutional neural network, transformers, etc.); Optimization objectives; Training algorithms;
      RLHF approaches; Fine-tuning or retrieval-augmented generation approaches; Evaluation data; Ethical
      considerations; Legal and regulatory requirements.'
    gai_action_risks:
    - information_integrity
    - harmful_bias_or_homogenization
  gai_subcategory_actor_tasks:
