    gai_action_risks:
    - human_ai_configuration
    - confabulation
  gai_subcategory_actor_tasks:
  - ai_impact_assessment
  - domain_expert
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 3.3
  description: Feedback processes for end users and impacted communities to report problems and appeal
    system outcomes are established and integrated into AI system evaluation metrics.
  gai_subcategory_actions:
  - gai_action_id: MS-3.3-001
    description: Conduct impact assessments on how AI-generated content might affect different social,
      economic, and cultural groups.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MS-3.3-002
    description: Conduct studies to understand how end users perceive and interact with GAI content and
      accompanying content provenance within context of use. Assess whether the content aligns with their
      expectations and how they may act upon the information presented.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
  - gai_action_id: MS-3.3-003
    description: Evaluate potential biases and stereotypes that could emerge from the AI-generated content
      using appropriate methodologies including computational testing methods as well as evaluating structured
      feedback input.
    gai_action_risks:
    - harmful_bias_or_homogenization
  - gai_action_id: MS-3.3-004
    description: Provide input for training materials about the capabilities and limitations of GAI systems
      related to digital content transparency for AI Actors, other professionals, and the public about
      the societal impacts of AI and the role of diverse and inclusive content generation.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
    - harmful_bias_or_homogenization
  - gai_action_id: MS-3.3-005
    description: Record and integrate structured feedback about content provenance from operators, users,
      and potentially impacted communities through the use of methods such as user research studies, focus
      groups, or community forums. Actively seek feedback on generated content quality and potential biases.
      Assess the general awareness among end users and impacted communities about the availability of
      these feedback channels.
    gai_action_risks:
    - human_ai_configuration
    - information_integrity
    - harmful_bias_or_homogenization
  gai_subcategory_actor_tasks:
  - ai_deployment
  - affected_individuals_and_communities
  - end_users
  - operation_and_monitoring
  - tevv
- ai_rmf_subcategory_id: MEASURE 4.2
  description: Measurement results regarding AI system trustworthiness in deployment context(s) and across
    the AI lifecycle are informed by input from domain experts and relevant AI Actors to validate whether
    the system is performing consistently as intended. Results are documented.
  gai_subcategory_actions:
  - gai_action_id: MS-4.2-001
    description: Conduct adversarial testing at a regular cadence to map and measure GAI risks, including
      tests to address attempts to deceive or manipulate the application of provenance techniques or other
      misuses. Identify vulnerabilities and understand potential misuse scenarios and unintended outputs.
    gai_action_risks:
    - information_integrity
    - information_security
  - gai_action_id: MS-4.2-002
    description: Evaluate GAI system performance in real-world scenarios to observe its behavior in practical
      environments and reveal issues that might not surface in controlled and optimized testing environments.
    gai_action_risks:
    - human_ai_configuration
    - confabulation
    - information_security
  - gai_action_id: MS-4.2-003
    description: Implement interpretability and explainability methods to evaluate GAI system decisions
      and verify alignment with intended purpose.
    gai_action_risks:
    - information_integrity
    - harmful_bias_or_homogenization
  - gai_action_id: MS-4.2-004
    description: Monitor and document instances where human operators or other systems override the GAI's
      decisions. Evaluate these cases to understand if the overrides are linked to issues related to content
      provenance.
    gai_action_risks:
    - information_integrity
  - gai_action_id: MS-4.2-005
    description: Verify and document the incorporation of results of structured public feedback exercises
      into design, implementation, deployment approval (“go”/“no-go” decisions), monitoring, and decommission
      decisions.
    gai_action_risks:
    - human_ai_configuration
    - information_security
